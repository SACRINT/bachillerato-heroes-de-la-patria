apiVersion: v1
kind: ConfigMap
metadata:
  name: bge-config
  namespace: default
data:
  redis-url: "redis://redis-service:6379"
  node-env: "production"
  cors-origin: "https://bge.edu.mx,https://www.bge.edu.mx"
  rate-limit-window: "900000"
  rate-limit-max: "300"
