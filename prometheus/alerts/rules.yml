# ============================================================================
# PROMETHEUS ALERT RULES - SEMANA 10
# Reglas de alertas para monitoring y SLA 99.9%
# ============================================================================

groups:
  # ==========================================================================
  # GRUPO 1: ALERTAS DE DISPONIBILIDAD (SLA 99.9%)
  # ==========================================================================
  - name: availability
    interval: 30s
    rules:
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{status_code=~"5.."}[5m]))
            /
            sum(rate(http_requests_total[5m]))
          ) > 0.01
        for: 5m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Error rate alto detectado"
          description: "Error rate es {{ $value | humanizePercentage }} en los últimos 5 minutos. SLA objetivo: 99.9% (0.1% errors máximo)"
          runbook_url: "https://docs.bge.edu.mx/runbooks/high-error-rate"

      - alert: ServiceDown
        expr: up{job="bge-backend"} == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Servicio BGE Backend está DOWN"
          description: "El servicio BGE Backend no responde. Prometheus no puede scrape métricas."
          runbook_url: "https://docs.bge.edu.mx/runbooks/service-down"

      - alert: DatabaseDown
        expr: |
          db_connections_active == 0
        for: 2m
        labels:
          severity: critical
          category: database
        annotations:
          summary: "Base de datos sin conexiones activas"
          description: "No hay conexiones activas a PostgreSQL por 2 minutos. Posible problema de conectividad."

  # ==========================================================================
  # GRUPO 2: ALERTAS DE PERFORMANCE
  # ==========================================================================
  - name: performance
    interval: 30s
    rules:
      - alert: HighResponseTime
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le, route)
          ) > 1
        for: 10m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "Response time p95 alto en {{ $labels.route }}"
          description: "p95 response time es {{ $value }}s (objetivo: <1s) para {{ $labels.route }}"
          runbook_url: "https://docs.bge.edu.mx/runbooks/high-response-time"

      - alert: SlowDatabaseQueries
        expr: |
          histogram_quantile(0.95,
            sum(rate(db_query_duration_seconds_bucket[5m])) by (le, table)
          ) > 0.5
        for: 10m
        labels:
          severity: warning
          category: database
        annotations:
          summary: "Queries lentas en tabla {{ $labels.table }}"
          description: "p95 query duration es {{ $value }}s (objetivo: <0.5s) para tabla {{ $labels.table }}"
          runbook_url: "https://docs.bge.edu.mx/runbooks/slow-queries"

      - alert: HighRequestRate
        expr: |
          sum(rate(http_requests_total[1m])) > 1000
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "Tráfico alto: {{ $value }} req/s"
          description: "El sistema está recibiendo {{ $value }} requests/segundo (límite: 1000/s). Considerar autoscaling."

  # ==========================================================================
  # GRUPO 3: ALERTAS DE RECURSOS (CPU, MEMORIA, DISCO)
  # ==========================================================================
  - name: resources
    interval: 30s
    rules:
      - alert: HighMemoryUsage
        expr: |
          (
            node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes
          ) / node_memory_MemTotal_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          category: resources
        annotations:
          summary: "Uso de memoria alto: {{ $value | humanizePercentage }}"
          description: "El sistema está usando {{ $value | humanizePercentage }} de memoria RAM. Límite: 90%."

      - alert: HighCPUUsage
        expr: |
          (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 0.8
        for: 10m
        labels:
          severity: warning
          category: resources
        annotations:
          summary: "Uso de CPU alto: {{ $value | humanizePercentage }}"
          description: "El CPU está al {{ $value | humanizePercentage }} de utilización. Límite: 80%."

      - alert: HighDiskUsage
        expr: |
          (
            node_filesystem_size_bytes{mountpoint="/"} - node_filesystem_free_bytes{mountpoint="/"}
          ) / node_filesystem_size_bytes{mountpoint="/"} > 0.9
        for: 5m
        labels:
          severity: warning
          category: resources
        annotations:
          summary: "Espacio en disco bajo: {{ $value | humanizePercentage }}"
          description: "El disco está al {{ $value | humanizePercentage }} de capacidad. Límite: 90%."

      - alert: OutOfMemory
        expr: |
          (
            node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes
          ) < 0.05
        for: 2m
        labels:
          severity: critical
          category: resources
        annotations:
          summary: "CRÍTICO: Memoria disponible < 5%"
          description: "Solo {{ $value | humanizePercentage }} de memoria disponible. Sistema en riesgo de OOM."

  # ==========================================================================
  # GRUPO 4: ALERTAS DE BASE DE DATOS
  # ==========================================================================
  - name: database
    interval: 30s
    rules:
      - alert: DatabaseConnectionPoolExhausted
        expr: |
          db_connections_active >= 18
        for: 5m
        labels:
          severity: critical
          category: database
        annotations:
          summary: "Connection pool casi agotado: {{ $value }}/20"
          description: "El pool de conexiones PostgreSQL está al {{ $value }}/20. Aumentar pool size o investigar queries lentas."

      - alert: HighDatabaseErrorRate
        expr: |
          (
            sum(rate(db_queries_total{status="error"}[5m]))
            /
            sum(rate(db_queries_total[5m]))
          ) > 0.01
        for: 5m
        labels:
          severity: warning
          category: database
        annotations:
          summary: "Error rate alto en queries SQL"
          description: "{{ $value | humanizePercentage }} de queries SQL fallan. Investigar logs."

      - alert: DatabaseConnectionLeaks
        expr: |
          rate(db_connections_active[5m]) > 0
          and
          rate(http_requests_total[5m]) == 0
        for: 10m
        labels:
          severity: warning
          category: database
        annotations:
          summary: "Posible connection leak detectado"
          description: "Hay conexiones activas pero sin requests HTTP. Posible leak."

  # ==========================================================================
  # GRUPO 5: ALERTAS DE NEGOCIO
  # ==========================================================================
  - name: business
    interval: 1m
    rules:
      - alert: HighLoginFailureRate
        expr: |
          (
            sum(rate(login_attempts_total{status="failed"}[5m]))
            /
            sum(rate(login_attempts_total[5m]))
          ) > 0.3
        for: 5m
        labels:
          severity: warning
          category: security
        annotations:
          summary: "Tasa de login fallidos alta: {{ $value | humanizePercentage }}"
          description: "{{ $value | humanizePercentage }} de intentos de login fallan. Posible ataque de fuerza bruta."

      - alert: NoUserRegistrations
        expr: |
          sum(increase(user_registrations_total[1h])) == 0
        for: 6h
        labels:
          severity: info
          category: business
        annotations:
          summary: "Sin registros de usuarios en 6 horas"
          description: "No ha habido registros de nuevos usuarios en las últimas 6 horas."

      - alert: LowCacheHitRate
        expr: |
          (
            sum(rate(cache_hits_total[5m]))
            /
            (sum(rate(cache_hits_total[5m])) + sum(rate(cache_misses_total[5m])))
          ) < 0.7
        for: 10m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "Cache hit rate bajo: {{ $value | humanizePercentage }}"
          description: "Cache hit rate es {{ $value | humanizePercentage }} (objetivo: >70%). Revisar estrategia de cache."

  # ==========================================================================
  # GRUPO 6: ALERTAS DE DEGRADACIÓN GRADUAL
  # ==========================================================================
  - name: degradation
    interval: 30s
    rules:
      - alert: ResponseTimeDegrading
        expr: |
          (
            histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[30m])) by (le))
            /
            histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[7d])) by (le))
          ) > 1.5
        for: 15m
        labels:
          severity: warning
          category: degradation
        annotations:
          summary: "Response time degradándose"
          description: "Response time p95 es 50% más lento que baseline de 7 días. Investigar."

      - alert: ErrorRateIncreasing
        expr: |
          (
            sum(rate(http_requests_total{status_code=~"5.."}[1h]))
            /
            sum(rate(http_requests_total{status_code=~"5.."}[7d]))
          ) > 2
        for: 30m
        labels:
          severity: warning
          category: degradation
        annotations:
          summary: "Error rate aumentando gradualmente"
          description: "Error rate es 2x mayor que baseline de 7 días. Investigar causa raíz."

# ============================================================================
# NOTAS DE CONFIGURACIÓN
# ============================================================================
#
# SLA Target: 99.9% uptime
# - Downtime permitido: 43.8 minutos/mes
# - Error rate máximo: 0.1% (1 de cada 1000 requests)
# - Response time p95: <1s
# - Response time p99: <2s
#
# Severidades:
# - critical: Impacto inmediato en usuarios, requiere acción inmediata
# - warning: Puede causar problemas si no se resuelve, requiere investigación
# - info: Informativo, no requiere acción inmediata
#
# Integración con Alertmanager:
# - critical → Slack #incidents + PagerDuty + Email
# - warning → Slack #monitoring + Email
# - info → Slack #monitoring
#
# ============================================================================
