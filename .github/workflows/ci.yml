name: CI/CD Pipeline - BGE Héroes de la Patria

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  validate-and-build:
    name: 🚀 Validation & Syntax Check
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔍 Check Code Syntax
        run: |
          echo "Validating JavaScript syntax across codebase..."
          find public/js -name "*.js" -type f -exec node -c {} +
          find api -name "*.js" -type f -exec node -c {} +
          find backend -name "*.js" -type f -exec node -c {} +
          echo "✅ 100% JavaScript files validated with 0 syntax errors!"

      - name: 📦 Check JSON Configurations
        run: |
          node -e "JSON.parse(require('fs').readFileSync('vercel.json', 'utf8')); console.log('✅ vercel.json is valid!');"
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8')); console.log('✅ package.json is valid!');"

      - name: 🚀 Ready for Vercel
        run: echo "🎉 Build & validation successful. Ready for deployment!"

