# ============================================================================
# CI/CD PRODUCTION PIPELINE
# Semana 19 - CI/CD Pipeline
# ============================================================================

name: CI/CD Production Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '18'
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint || echo "Linter not configured"

      - name: Run unit tests
        run: npm run test:unit || npm test

      - name: Run integration tests
        run: npm run test:integration || echo "Integration tests pending"
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

      - name: Upload coverage
        uses: codecov/codecov-action@v3

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Run security audit
        run: npm audit --audit-level=moderate

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2

  build:
    needs: [test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build Docker image
        run: |
          docker build -f Dockerfile.production -t ${{ env.REGISTRY }}/bge:${{ github.sha }} .
          docker tag ${{ env.REGISTRY }}/bge:${{ github.sha }} ${{ env.REGISTRY }}/bge:latest

      - name: Push to registry
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          docker push ${{ env.REGISTRY }}/bge:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/bge:latest

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/bge-app bge-app=${{ env.REGISTRY }}/bge:${{ github.sha }} -n production

      - name: Smoke tests
        run: |
          curl -f https://api.bge.edu.mx/health || exit 1
