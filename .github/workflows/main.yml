# ============================================
# CI/CD Pipeline - Proyecto BGE
# ============================================
# Pipeline de Integración Continua y Despliegue
# Fecha: 18 de Octubre, 2025
#
# Flujo:
# 1. Lint → Verificar código con ESLint
# 2. Test → Ejecutar pruebas (cuando estén implementadas)
# 3. Build → Construir el proyecto
# 4. Deploy → Desplegar a Vercel (solo en main)

name: CI/CD Pipeline

# Trigger del workflow
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Variables de entorno globales
env:
  NODE_VERSION: '18.x'
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # ============================================
  # JOB 1: LINTING
  # ============================================
  lint:
    name: 📝 Linting
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🔍 Ejecutar ESLint
        run: npm run lint --if-present || echo "⚠️ Script lint no encontrado, omitiendo..."
        continue-on-error: true

      - name: ✅ Verificar formato de código
        run: npx prettier --check "**/*.{js,json,md}" || echo "⚠️ Prettier no configurado"
        continue-on-error: true

  # ============================================
  # JOB 2: TESTING
  # ============================================
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🔧 Configurar variables de entorno para tests
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_db" >> $GITHUB_ENV
          echo "NODE_ENV=test" >> $GITHUB_ENV
          echo "JWT_SECRET=test_jwt_secret_for_github_actions_ci_cd" >> $GITHUB_ENV
          echo "SESSION_SECRET=test_session_secret_for_github_actions" >> $GITHUB_ENV

      - name: 🧪 Ejecutar tests unitarios
        run: npm test --if-present || echo "⚠️ Tests no implementados aún, omitiendo..."
        continue-on-error: true

      - name: 🧪 Ejecutar tests de integración
        run: npm run test:integration --if-present || echo "⚠️ Tests de integración no implementados"
        continue-on-error: true

      - name: 📊 Generar reporte de cobertura
        run: npm run test:coverage --if-present || echo "⚠️ Cobertura no configurada"
        continue-on-error: true

  # ============================================
  # JOB 3: BUILD
  # ============================================
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🏗️ Construir proyecto
        run: npm run build --if-present || echo "⚠️ No hay script de build, omitiendo..."

      - name: 📁 Verificar archivos generados
        run: |
          echo "✅ Verificando estructura del proyecto..."
          ls -la
          if [ -d "dist" ]; then
            echo "✅ Directorio dist encontrado"
            ls -la dist
          fi
          if [ -d "build" ]; then
            echo "✅ Directorio build encontrado"
            ls -la build
          fi

      - name: 💾 Cachear artefactos de build
        uses: actions/cache@v3
        with:
          path: |
            dist
            build
            .next
          key: ${{ runner.os }}-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-

  # ============================================
  # JOB 4: SECURITY SCAN
  # ============================================
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🔍 Auditoría de seguridad npm
        run: npm audit --audit-level=moderate || echo "⚠️ Vulnerabilidades encontradas, revisar manualmente"
        continue-on-error: true

      - name: 🔒 Verificar dependencias obsoletas
        run: npx npm-check-updates || echo "⚠️ Dependencias desactualizadas"
        continue-on-error: true

  # ============================================
  # JOB 5: DEPLOY A VERCEL (Solo en main)
  # ============================================
  deploy:
    name: 🚀 Deploy a Vercel
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: 🔍 Verificar variables de entorno de Vercel
        run: |
          if [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "❌ Error: VERCEL_ORG_ID o VERCEL_PROJECT_ID no están configurados"
            echo "Por favor, configura los secrets en GitHub:"
            echo "- VERCEL_ORG_ID"
            echo "- VERCEL_PROJECT_ID"
            echo "- VERCEL_TOKEN"
            exit 1
          fi

      - name: 📥 Pull de información del proyecto Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: 🏗️ Build del proyecto Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: 🚀 Deploy a producción
        id: deploy
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "✅ Despliegue exitoso: $DEPLOYMENT_URL"

      - name: 🏥 Health Check Post-Deploy
        run: |
          sleep 10
          HEALTH_URL="${{ steps.deploy.outputs.url }}/api/health/simple"
          echo "🔍 Verificando health check en: $HEALTH_URL"
          curl -f $HEALTH_URL || echo "⚠️ Health check falló, verificar manualmente"
        continue-on-error: true

      - name: 📢 Notificación de deploy exitoso
        run: |
          echo "🎉 Deploy completado exitosamente!"
          echo "🌐 URL de producción: ${{ steps.deploy.outputs.url }}"
          echo "📅 Fecha: $(date)"
          echo "👤 Autor: ${{ github.actor }}"
          echo "📝 Commit: ${{ github.event.head_commit.message }}"

  # ============================================
  # JOB 6: NOTIFICACIÓN DE ESTADO
  # ============================================
  notify:
    name: 📢 Notificación
    runs-on: ubuntu-latest
    needs: [lint, test, build, security, deploy]
    if: always()

    steps:
      - name: 📊 Resumen del pipeline
        run: |
          echo "============================================"
          echo "📊 RESUMEN DEL PIPELINE CI/CD"
          echo "============================================"
          echo "🔹 Lint: ${{ needs.lint.result }}"
          echo "🔹 Test: ${{ needs.test.result }}"
          echo "🔹 Build: ${{ needs.build.result }}"
          echo "🔹 Security: ${{ needs.security.result }}"
          echo "🔹 Deploy: ${{ needs.deploy.result }}"
          echo "============================================"
          echo "✅ Pipeline completado"

      - name: ✅ Estado final
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ] || [ "${{ needs.deploy.result }}" == "skipped" ]; then
            echo "✅ Pipeline exitoso"
            exit 0
          else
            echo "❌ Pipeline falló"
            exit 1
          fi
