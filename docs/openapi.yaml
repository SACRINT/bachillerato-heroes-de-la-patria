openapi: 3.0.3
externalDocs:
  description: Portal de Desarrolladores de BGE Héroes de la Patria
  url: /developer-portal.html
info:
  title: BGE Héroes de la Patria - API
  description: |-
    API para la plataforma de gestión educativa BGE Héroes de la Patria.
    Esta documentación cubre todos los endpoints disponibles para la interacción con los servicios de backend, incluyendo gestión de usuarios, datos académicos, inteligencia artificial y más.
  version: 6.0.0
servers:
  - url: https://bachilleres-heroes-de-la-patria.vercel.app/api
    description: Servidor de Producción (Vercel)
  - url: http://localhost:3000/api
    description: Servidor de Desarrollo Local
tags:
  - name: Auth
    description: Autenticación y gestión de sesiones de usuario
  - name: Students
    description: Gestión de la información de los estudiantes
  - name: Grades
    description: Gestión de calificaciones y rendimiento académico
  - name: AI-Tutor
    description: Endpoints para el sistema de Tutoría con Inteligencia Artificial
  - name: Admin
    description: Operaciones administrativas
  - name: JobBoard
    description: Bolsa de Trabajo - Gestión de CVs y Solicitudes
  - name: Appointments
    description: Gestión de citas con validaciones y confirmaciones
  - name: News
    description: Sistema de Gestión de Noticias
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: "samuel.c"
        email:
          type: string
          format: email
          example: "samuel.c@bge.edu.mx"
        nombre:
          type: string
          example: "Samuel"
        apellido_paterno:
          type: string
          example: "Castillo"
        role:
          type: string
          enum: [admin, docente, estudiante, padre_familia]
          example: "admin"
    Student:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: "Juan"
        apellido_paterno:
          type: string
          example: "Pérez"
        email:
          type: string
          format: email
        matricula:
          type: string
        semestre:
          type: integer
        especialidad:
          type: string
        status_academico:
          type: string
          enum: [activo, baja, egresado]
    NewStudent:
      type: object
      required:
        - nombre
        - email
      properties:
        nombre:
          type: string
        email:
          type: string
          format: email
        matricula:
          type: string
        especialidad:
          type: string
        semestre:
          type: integer
    StudentList:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Student'
        pagination:
          type: object
          properties:
            totalItems:
              type: integer
            totalPages:
              type: integer
            currentPage:
              type: integer
    Grade:
      type: object
      properties:
        id:
          type: integer
        estudiante_id:
          type: integer
        docente_id:
          type: integer
        materia:
          type: string
        parcial:
          type: integer
        calificacion:
          type: number
          format: float
        ciclo:
          type: string
    NewGrade:
      type: object
      required:
        - estudiante_id
        - materia
        - calificacion
      properties:
        estudiante_id:
          type: integer
        materia:
          type: string
        calificacion:
          type: number
          format: float
        parcial:
          type: integer
        ciclo:
          type: string
    GradeList:
       type: object
       properties:
         success:
           type: boolean
         data:
           type: array
           items:
             $ref: '#/components/schemas/Grade'
         pagination:
           type: object
           properties:
             totalItems:
               type: integer
             totalPages:
               type: integer
             currentPage:
               type: integer
    TutorProfile:
        type: object
        properties:
            user_id:
                type: integer
            learning_style:
                type: string
                enum: [visual, auditory, reading, kinesthetic, multimodal]
            preferred_difficulty:
                type: string
                enum: [easy, medium, hard, adaptive]
    TutorSession:
        type: object
        properties:
            id:
                type: integer
            user_id:
                type: integer
            subject:
                type: string
            topic:
                type: string
            status:
                type: string
                enum: [in_progress, completed]
    TutorMessage:
        type: object
        properties:
            role:
                type: string
                enum: [user, assistant]
            content:
                type: string
    RegistrationRequest:
        type: object
        properties:
            id:
                type: string
            fullName:
                type: string
            email:
                type: string
                format: email
            requestedRole:
                type: string
                enum: [docente, estudiante, administrativo]
            status:
                type: string
                enum: [pending, approved, rejected]
    AdminStats:
        type: object
        properties:
            total:
                type: integer
            pending:
                type: integer
            approved:
                type: integer
            rejected:
                type: integer
    CVProfileRequest:
        type: object
        required:
            - name
            - email
            - phone
            - graduationYear
            - subject
            - message
        properties:
            name:
                type: string
            email:
                type: string
                format: email
            phone:
                type: string
            graduationYear:
                type: string
            subject:
                type: string
            message:
                type: string
            skills:
                type: array
                items:
                    type: string
    CVProfile:
        type: object
        properties:
            id:
                type: integer
            nombre:
                type: string
            email:
                type: string
                format: email
            telefono:
                type: string
            anio_egreso:
                type: string
            area_interes:
                type: string
            resumen_profesional:
                type: string
            habilidades:
                type: array
                items:
                    type: string
            status:
                type: string
                enum: [activo, inactivo, contratado]
            fecha_registro:
                type: string
                format: date-time
    CVStats:
        type: object
        properties:
            total:
                type: integer
            activos:
                type: integer
            inactivos:
                type: integer
            contratados:
                type: integer
            hoy:
                type: integer
            esta_semana:
                type: integer
            verificados:
                type: integer
            byYear:
                type: object
            byArea:
                type: object
    ApprovalAction:
        type: object
        required:
            - action
        properties:
            action:
                type: string
                enum: [approve, reject]
            adminNotes:
                type: string
    Appointment:
        type: object
        properties:
            id:
                type: integer
            cita_id:
                type: string
            nombre_completo:
                type: string
            email:
                type: string
                format: email
            telefono:
                type: string
            tipo_persona:
                type: string
                enum: [estudiante, padre, madre, tutor, docente, administrativo, externo]
            motivo:
                type: string
            descripcion:
                type: string
            fecha_solicitada:
                type: string
                format: date
            hora_solicitada:
                type: string
            estado:
                type: string
                enum: [pendiente, aprobada, rechazada, completada]
            confirmada:
                type: boolean
            notas_admin:
                type: string
            created_at:
                type: string
                format: date-time
    NewAppointment:
        type: object
        required:
            - nombre_completo
            - email
            - tipo_persona
            - motivo
            - fecha_solicitada
            - hora_solicitada
            - departamento
        properties:
            nombre_completo:
                type: string
            email:
                type: string
                format: email
            telefono:
                type: string
            tipo_persona:
                type: string
                enum: [estudiante, padre, madre, tutor, docente, administrativo, externo]
            motivo:
                type: string
            descripcion:
                type: string
            fecha_solicitada:
                type: string
                format: date
            hora_solicitada:
                type: string
            departamento:
                type: string
    AppointmentStats:
        type: object
        properties:
            pendientes:
                type: integer
            aprobadas:
                type: integer
            rechazadas:
                type: integer
            completadas:
                type: integer
            noConfirmadas:
                type: integer
            total:
                type: integer
    AvailableSlots:
        type: object
        properties:
            hora:
                type: string
            disponibles:
                type: integer
            ocupados:
                type: integer
    ApproveRejectAppointment:
        type: object
        properties:
            notas_admin:
                type: string
            motivo_rechazo:
                type: string
    NewsArticle:
        type: object
        properties:
            id:
                type: integer
            titulo:
                type: string
            contenido:
                type: string
            resumen:
                type: string
            imagen_url:
                type: string
                format: url
            categoria:
                type: string
            etiquetas:
                type: array
                items:
                    type: string
            estado:
                type: string
                enum: [borrador, publicada]
            autor:
                type: string
            autor_id:
                type: integer
            slug:
                type: string
            meta_descripcion:
                type: string
            destacada:
                type: boolean
            fecha_publicacion:
                type: string
                format: date-time
            fecha_creacion:
                type: string
                format: date-time
            fecha_modificacion:
                type: string
                format: date-time
    NewNewsArticle:
        type: object
        required:
            - titulo
            - contenido
            - autor
        properties:
            titulo:
                type: string
            contenido:
                type: string
            resumen:
                type: string
            imagen_url:
                type: string
                format: url
            categoria:
                type: string
            etiquetas:
                type: array
                items:
                    type: string
            estado:
                type: string
                enum: [borrador, publicada]
            autor:
                type: string
            autor_id:
                type: integer
            meta_descripcion:
                type: string
            destacada:
                type: boolean
    UpdateNewsArticle:
        type: object
        properties:
            titulo:
                type: string
            contenido:
                type: string
            resumen:
                type: string
            imagen_url:
                type: string
                format: url
            categoria:
                type: string
            etiquetas:
                type: array
                items:
                    type: string
            estado:
                type: string
                enum: [borrador, publicada]
            meta_descripcion:
                type: string
            destacada:
                type: boolean
    NewsStats:
        type: object
        properties:
            total:
                type: integer
            publicadas:
                type: integer
            borradores:
                type: integer
            destacadas:
                type: integer
            vistas_totales:
                type: integer
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: "admin"
        password:
          type: string
          format: password
          example: "HeroesPatria2024!"
        rememberMe:
          type: boolean
          default: false
    TokenPair:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        accessTokenExpiry:
          type: integer
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: 'Error en la solicitud'
        errors:
          type: array
          items:
            type: object
            properties:
              msg:
                type: string
                example: "Parámetro 'email' inválido"
              param:
                type: string
                example: "email"
              location:
                type: string
                example: "body"
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags:
        - Auth
      summary: Iniciar sesión
      description: Autentica a un usuario y devuelve un par de tokens de acceso y de refresco.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    $ref: '#/components/schemas/User'
                  tokens:
                    $ref: '#/components/schemas/TokenPair'
        '400':
          description: Datos de entrada inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/register:
    post:
      tags:
        - Auth
      summary: Registrar un nuevo usuario (Solo Admin)
      description: Permite a un administrador registrar un nuevo usuario en el sistema.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                username:
                  type: string
                nombre:
                  type: string
                apellido_paterno:
                  type: string
                role:
                  type: string
                  enum: [admin, docente, estudiante, padre_familia]
      responses:
        '201':
          description: Usuario registrado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  user:
                    $ref: '#/components/schemas/User'
        '403':
          description: No autorizado (no es admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Renovar token de acceso
      description: Genera un nuevo par de tokens a partir de un token de refresco válido.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Tokens renovados
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  tokens:
                    $ref: '#/components/schemas/TokenPair'
        '403':
          description: Token de refresco inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/profile:
    get:
      tags:
        - Auth
      summary: Obtener perfil de usuario
      description: Devuelve el perfil del usuario autenticado actualmente.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil del usuario
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /students-v2:
    get:
      tags:
        - Students
      summary: Obtener lista de estudiantes
      description: Devuelve una lista paginada de estudiantes, con opciones de filtro y ordenamiento.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Término de búsqueda para nombre, email o matrícula.
        - in: query
          name: grado
          schema:
            type: integer
          description: Filtrar por grado.
        - in: query
          name: status
          schema:
            type: string
          description: Filtrar por status académico.
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Número de página.
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
          description: Número de resultados por página.
      responses:
        '200':
          description: Lista de estudiantes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentList'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Students
      summary: Crear un nuevo estudiante
      description: Registra un nuevo estudiante en el sistema. Requiere permisos de administrador.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewStudent'
      responses:
        '201':
          description: Estudiante creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '400':
          description: Datos inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /students-v2/{id}:
    get:
      tags:
        - Students
      summary: Obtener un estudiante por ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalles del estudiante.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '404':
          description: Estudiante no encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Students
      summary: Actualizar un estudiante
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewStudent'
      responses:
        '200':
          description: Estudiante actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
    delete:
      tags:
        - Students
      summary: Eliminar un estudiante (Soft delete)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Estudiante eliminado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
  /grades-v2:
    get:
      tags:
        - Grades
      summary: Obtener lista de calificaciones
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: estudianteId
          schema:
            type: integer
        - in: query
          name: materia
          schema:
            type: string
        - in: query
          name: ciclo
          schema:
            type: string
      responses:
        '200':
          description: Lista de calificaciones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradeList'
    post:
      tags:
        - Grades
      summary: Crear una nueva calificación
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewGrade'
      responses:
        '201':
          description: Calificación creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grade'
  /grades-v2/{id}:
    get:
      tags:
        - Grades
      summary: Obtener una calificación por ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalles de la calificación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grade'
    put:
      tags:
        - Grades
      summary: Actualizar una calificación
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewGrade'
      responses:
        '200':
          description: Calificación actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grade'
    delete:
      tags:
        - Grades
      summary: Eliminar una calificación
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Calificación eliminada.
  /tutor/profile:
    get:
      tags:
        - AI-Tutor
      summary: Obtener perfil de aprendizaje del Tutor IA
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil del usuario para el tutor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorProfile'
  /tutor/sessions:
    post:
      tags:
        - AI-Tutor
      summary: Iniciar una nueva sesión de tutoría
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  type: string
                topic:
                  type: string
      responses:
        '201':
          description: Sesión de tutoría iniciada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/TutorSession'
  /tutor/sessions/{sessionId}/messages:
    post:
      tags:
        - AI-Tutor
      summary: Enviar un mensaje a la sesión de tutoría
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
      responses:
        '201':
          description: Respuesta de la IA.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/TutorMessage'
  /admin/pending-registrations:
    get:
      tags:
        - Admin
      summary: Obtener solicitudes de registro pendientes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de solicitudes pendientes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  requests:
                    type: array
                    items:
                      $ref: '#/components/schemas/RegistrationRequest'
                  totalRequests:
                    type: integer
                  timestamp:
                    type: string
                    format: date-time
  /admin/all-registrations:
    get:
      tags:
        - Admin
      summary: Obtener todas las solicitudes de registro
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de todas las solicitudes y estadísticas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  stats:
                    $ref: '#/components/schemas/AdminStats'
                  requests:
                    type: array
                    items:
                      $ref: '#/components/schemas/RegistrationRequest'
                  timestamp:
                    type: string
                    format: date-time
  /admin/approve-registration:
    post:
      tags:
        - Admin
      summary: Aprobar una solicitud de registro
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                requestId:
                  type: string
      responses:
        '200':
