openapi: 3.0.3
info:
  title: BGE API - Bachillerato General Estatal "Héroes de la Patria"
  description: |
    API RESTful para el Sistema de Gestión Educativa BGE.

    ## Autenticación
    La API utiliza JWT (JSON Web Tokens) para autenticación.
    Incluye el token en el header `Authorization: Bearer <token>`

    ## Rate Limiting
    - Endpoints públicos: 100 requests/15min
    - Endpoints autenticados: 1000 requests/15min
    - Login: 5 intentos/15min

    ## Códigos de Error
    - `400` - Bad Request (validación fallida)
    - `401` - Unauthorized (token inválido/expirado)
    - `403` - Forbidden (sin permisos)
    - `404` - Not Found (recurso no existe)
    - `429` - Too Many Requests (rate limit)
    - `500` - Internal Server Error
  version: 5.0.0
  contact:
    name: Soporte BGE
    email: soporte@bge.edu.mx
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://bachillerato-heroes.vercel.app/api
    description: Producción
  - url: http://localhost:3000/api
    description: Desarrollo local

tags:
  - name: Auth
    description: Autenticación y gestión de sesiones
  - name: Students
    description: Gestión de estudiantes
  - name: Grades
    description: Calificaciones y evaluaciones
  - name: Teachers
    description: Gestión de docentes
  - name: Parents
    description: Portal de padres
  - name: Appointments
    description: Sistema de citas
  - name: Notifications
    description: Sistema de notificaciones
  - name: Reports
    description: Generación de reportes
  - name: Admin
    description: Administración del sistema

paths:
  /auth/login:
    post:
      tags:
        - Auth
      summary: Iniciar sesión
      description: Autentica un usuario y devuelve tokens JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: admin@bge.edu.mx
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: "********"
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Demasiados intentos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/google:
    post:
      tags:
        - Auth
      summary: Login con Google OAuth
      description: Autentica usuario con token de Google
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - credential
              properties:
                credential:
                  type: string
                  description: JWT token de Google
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Token inválido

  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Renovar token
      description: Obtiene nuevo access token usando refresh token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token renovado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /students:
    get:
      tags:
        - Students
      summary: Listar estudiantes
      description: Obtiene lista paginada de estudiantes con filtros
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: search
          in: query
          schema:
            type: string
          description: Buscar por nombre o matrícula
        - name: grado
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 6
        - name: grupo
          in: query
          schema:
            type: string
            enum: [A, B, C, D]
        - name: status
          in: query
          schema:
            type: string
            enum: [activo, inactivo, egresado, baja]
      responses:
        '200':
          description: Lista de estudiantes
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Student'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          description: No autorizado

    post:
      tags:
        - Students
      summary: Crear estudiante
      description: Registra un nuevo estudiante
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentInput'
      responses:
        '201':
          description: Estudiante creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Student'
        '400':
          description: Datos inválidos

  /students/{id}:
    get:
      tags:
        - Students
      summary: Obtener estudiante
      description: Obtiene información detallada de un estudiante
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Datos del estudiante
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Student'
        '404':
          description: Estudiante no encontrado

    put:
      tags:
        - Students
      summary: Actualizar estudiante
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentInput'
      responses:
        '200':
          description: Estudiante actualizado
        '404':
          description: Estudiante no encontrado

    delete:
      tags:
        - Students
      summary: Eliminar estudiante
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Estudiante eliminado
        '404':
          description: No encontrado

  /grades:
    get:
      tags:
        - Grades
      summary: Listar calificaciones
      security:
        - bearerAuth: []
      parameters:
        - name: estudiante_id
          in: query
          schema:
            type: integer
        - name: materia_id
          in: query
          schema:
            type: integer
        - name: periodo
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista de calificaciones
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Grade'

    post:
      tags:
        - Grades
      summary: Registrar calificación
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradeInput'
      responses:
        '201':
          description: Calificación registrada

  /grades/bulk:
    post:
      tags:
        - Grades
      summary: Registrar calificaciones en lote
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                grades:
                  type: array
                  items:
                    $ref: '#/components/schemas/GradeInput'
      responses:
        '201':
          description: Calificaciones registradas

  /appointments:
    get:
      tags:
        - Appointments
      summary: Listar citas
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pendiente, confirmada, cancelada, completada]
        - name: fecha_inicio
          in: query
          schema:
            type: string
            format: date
        - name: fecha_fin
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Lista de citas

    post:
      tags:
        - Appointments
      summary: Solicitar cita
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentInput'
      responses:
        '201':
          description: Cita solicitada

  /notifications:
    get:
      tags:
        - Notifications
      summary: Obtener notificaciones
      security:
        - bearerAuth: []
      parameters:
        - name: leida
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Lista de notificaciones
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'

  /notifications/{id}/read:
    patch:
      tags:
        - Notifications
      summary: Marcar como leída
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Notificación actualizada

  /reports/student/{id}:
    get:
      tags:
        - Reports
      summary: Reporte de estudiante
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: format
          in: query
          schema:
            type: string
            enum: [json, pdf, excel]
            default: json
      responses:
        '200':
          description: Reporte generado

  /analytics/predictive/risk:
    get:
      tags:
        - Reports
      summary: Predicción de riesgo académico
      security:
        - bearerAuth: []
      parameters:
        - name: threshold
          in: query
          schema:
            type: number
            default: 7.0
      responses:
        '200':
          description: Predicciones de riesgo

  /health:
    get:
      tags:
        - Admin
      summary: Estado del sistema
      responses:
        '200':
          description: Sistema operativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                    example: 5.0.0
                  timestamp:
                    type: string
                    format: date-time

  /admin/users:
    get:
      tags:
        - Admin
      summary: Listar usuarios
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de usuarios

  /admin/tenant/config:
    get:
      tags:
        - Admin
      summary: Configuración del tenant
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Configuración actual

    put:
      tags:
        - Admin
      summary: Actualizar configuración
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Configuración actualizada

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            token:
              type: string
            refreshToken:
              type: string
            user:
              type: object
              properties:
                id:
                  type: integer
                email:
                  type: string
                role:
                  type: string
                nombre:
                  type: string

    Student:
      type: object
      properties:
        id:
          type: integer
        matricula:
          type: string
        nombre:
          type: string
        apellido_paterno:
          type: string
        apellido_materno:
          type: string
        email:
          type: string
          format: email
        grado:
          type: integer
        grupo:
          type: string
        semestre:
          type: integer
        promedio:
          type: number
        status:
          type: string
          enum: [activo, inactivo, egresado, baja]
        created_at:
          type: string
          format: date-time

    StudentInput:
      type: object
      required:
        - nombre
        - apellido_paterno
        - email
        - grado
        - grupo
      properties:
        matricula:
          type: string
        nombre:
          type: string
          minLength: 2
        apellido_paterno:
          type: string
          minLength: 2
        apellido_materno:
          type: string
        email:
          type: string
          format: email
        grado:
          type: integer
          minimum: 1
          maximum: 6
        grupo:
          type: string
          enum: [A, B, C, D]
        semestre:
          type: integer
          minimum: 1
          maximum: 12
        status:
          type: string
          enum: [activo, inactivo]

    Grade:
      type: object
      properties:
        id:
          type: integer
        estudiante_id:
          type: integer
        materia_id:
          type: integer
        materia_nombre:
          type: string
        calificacion:
          type: number
          minimum: 0
          maximum: 10
        periodo:
          type: string
        fecha_registro:
          type: string
          format: date-time

    GradeInput:
      type: object
      required:
        - estudiante_id
        - materia_id
        - calificacion
      properties:
        estudiante_id:
          type: integer
        materia_id:
          type: integer
        calificacion:
          type: number
          minimum: 0
          maximum: 10
        periodo:
          type: string

    AppointmentInput:
      type: object
      required:
        - motivo
        - fecha_solicitada
        - hora_solicitada
      properties:
        motivo:
          type: string
          minLength: 10
        fecha_solicitada:
          type: string
          format: date
        hora_solicitada:
          type: string
          pattern: '^([01]?[0-9]|2[0-3]):[0-5][0-9]$'
        notas:
          type: string

    Notification:
      type: object
      properties:
        id:
          type: integer
        usuario_id:
          type: integer
        titulo:
          type: string
        mensaje:
          type: string
        tipo:
          type: string
          enum: [info, warning, error, success]
        leida:
          type: boolean
        created_at:
          type: string
          format: date-time

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
