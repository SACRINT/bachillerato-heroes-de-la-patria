# ============================================================================
# LOGSTASH PIPELINE CONFIGURATION
# Procesamiento de logs para BGE
# ============================================================================

input {
  # Recibir logs desde Winston (HTTP transport)
  http {
    port => 5000
    codec => json
  }

  # Leer logs desde archivos
  file {
    path => "/logs/combined.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => json
  }

  file {
    path => "/logs/error.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => json
  }

  file {
    path => "/logs/http.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => json
  }
}

filter {
  # Parsear timestamp
  date {
    match => [ "timestamp", "ISO8601", "YYYY-MM-DD HH:mm:ss:ms" ]
    target => "@timestamp"
  }

  # Agregar campos calculados
  mutate {
    add_field => {
      "environment" => "${NODE_ENV:development}"
      "application" => "bge-heroes-patria"
    }
  }

  # Extraer información del user-agent
  if [userAgent] {
    useragent {
      source => "userAgent"
      target => "user_agent_parsed"
    }
  }

  # Clasificar por severity
  if [level] == "error" {
    mutate {
      add_tag => ["alert"]
      add_field => { "severity" => "high" }
    }
  } else if [level] == "warn" {
    mutate {
      add_field => { "severity" => "medium" }
    }
  } else {
    mutate {
      add_field => { "severity" => "low" }
    }
  }

  # Parsear stack traces
  if [stack] {
    mutate {
      gsub => [
        "stack", "\n", " | "
      ]
    }
  }
}

output {
  # Enviar a Elasticsearch
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "bge-logs-%{+YYYY.MM.dd}"
    document_type => "_doc"
  }

  # Salida a consola (debugging)
  stdout {
    codec => rubydebug
  }
}
