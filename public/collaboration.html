<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizarra Colaborativa | BGE Héroes</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/collaboration.css">

    <!-- PWA -->
    <link rel="icon" href="/images/logo/logo-general-bge.webp" type="image/webp">
    <link rel="apple-touch-icon" href="/images/logo/logo-general-bge.webp">
    <meta name="theme-color" content="#ffffff">

    <style>
        .avatar-red {
            background: #fca5a5;
        }

        .avatar-blue {
            background: #93c5fd;
        }

        .color-black {
            background: #000;
        }

        .color-red {
            background: #ef4444;
        }

        .color-blue {
            background: #3b82f6;
        }

        .color-green {
            background: #22c55e;
        }
    body { padding-top: 70px; }
.collab-layout { height: calc(100vh - 70px); }
</style>
    <!-- Global Header/Footer Styles -->
    <link rel="stylesheet" href="css/global-layout.css">
    <link rel="stylesheet" href="css/header-styles.css?v=2025111802">
    <link rel="stylesheet" href="css/footer-styles.css?v=2025111802">
    <script src="js/main.js" defer></script>
</head>

<body>
    <!-- Main Universal Header -->
    <header id="main-header"></header>

    <div class="collab-layout">
        <!-- Header -->
        <header class="collab-header">
            <a href="study-groups.html" class="btn btn-light btn-sm me-3 border" aria-label="Volver a grupos de estudio"
                title="Volver a grupos de estudio">
                <i class="fas fa-chevron-left"></i>
            </a>

            <div class="session-info">
                <h6 class="mb-0 fw-bold" id="session-name">Cálculo Diferencial: Repaso</h6>
                <div class="session-badge mt-1">
                    <div class="live-indicator"></div>
                    <span>En Vivo</span>
                </div>
            </div>

            <div class="participants-list" id="participants-container">
                <div class="avatar-stack" title="Tú">ME</div>
                <div class="avatar-stack avatar-red" title="Usuario AG">AG</div>
                <div class="avatar-stack avatar-blue" title="Usuario CR">CR</div>
                <div class="avatar-stack bg-dark text-white" title="Más participantes">+2</div>
            </div>

            <button class="btn btn-primary btn-sm ms-3" onclick="saveSnapshot()">
                <i class="fas fa-save me-1"></i> Guardar
            </button>
        </header>

        <!-- Canvas -->
        <div class="canvas-container" id="canvas-wrapper">
            <canvas id="whiteboard"></canvas>

            <!-- Toolbar -->
            <div class="floating-toolbar">
                <button class="tool-btn active" onclick="setTool('pen')" title="Lápiz">
                    <i class="fas fa-pen"></i>
                    <!-- Color Picker Mock -->
                    <div class="color-options">
                        <div class="color-dot color-black" role="button" aria-label="Color negro" title="Color negro"
                            onclick="setColor('#000000')"></div>
                        <div class="color-dot color-red" role="button" aria-label="Color rojo" title="Color rojo"
                            onclick="setColor('#ef4444')"></div>
                        <div class="color-dot color-blue" role="button" aria-label="Color azul" title="Color azul"
                            onclick="setColor('#3b82f6')"></div>
                        <div class="color-dot color-green" role="button" aria-label="Color verde" title="Color verde"
                            onclick="setColor('#22c55e')"></div>
                    </div>
                </button>
                <button class="tool-btn" onclick="setTool('eraser')" title="Borrador">
                    <i class="fas fa-eraser"></i>
                </button>
                <button class="tool-btn" onclick="setTool('rect')" title="Rectángulo">
                    <i class="far fa-square"></i>
                </button>
                <button class="tool-btn" onclick="clearCanvas()" title="Limpiar Todo">
                    <i class="fas fa-trash-alt text-danger"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Socket.IO (Mock for dev, real via CDN or local bundle) -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="js/collaboration-whiteboard.js"></script>
    <script src="js/tenant-config-loader.js"></script>
    <script src="js/tenant-content-binder.js"></script>
        <footer id="main-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
