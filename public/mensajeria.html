<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensajería Interna - BGE</title>

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        :root {
            --primary-color: #0066cc;
            --secondary-color: #e3f2fd;
            --border-color: #dee2e6;
            --unread-bg: #f8f9fa;
            --message-sent: #dcf8c6;
            --message-received: #ffffff;
            --typing-color: #999;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
            background-color: #f0f2f5;
        }

        /* Layout principal */
        .messaging-container {
            display: flex;
            height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
            background: white;
        }

        /* Sidebar de conversaciones */
        .conversations-sidebar {
            width: 350px;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            background: white;
        }

        .sidebar-header {
            padding: 15px 20px;
            background: var(--primary-color);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h5 {
            margin: 0;
            font-size: 1.1rem;
        }

        .search-box {
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .search-box input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            outline: none;
            font-size: 14px;
        }

        .conversations-list {
            flex: 1;
            overflow-y: auto;
        }

        .conversation-item {
            padding: 12px 15px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            gap: 12px;
            align-items: start;
        }

        .conversation-item:hover {
            background: var(--unread-bg);
        }

        .conversation-item.active {
            background: var(--secondary-color);
        }

        .conversation-item.unread {
            background: #f0f8ff;
            font-weight: 600;
        }

        .conversation-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .conversation-info {
            flex: 1;
            min-width: 0;
        }

        .conversation-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .conversation-name {
            font-weight: 600;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conversation-time {
            font-size: 12px;
            color: #999;
        }

        .conversation-last-message {
            font-size: 14px;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .unread-badge {
            background: var(--primary-color);
            color: white;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
        }

        /* Chat área */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #e5ddd5;
        }

        .chat-header {
            padding: 12px 20px;
            background: white;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header-title {
            font-weight: 600;
            font-size: 16px;
        }

        .chat-header-subtitle {
            font-size: 13px;
            color: #999;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            display: flex;
            margin-bottom: 8px;
            animation: messageIn 0.3s ease;
        }

        @keyframes messageIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.sent {
            justify-content: flex-end;
        }

        .message.received {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 65%;
            padding: 8px 12px;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            position: relative;
        }

        .message.sent .message-content {
            background: var(--message-sent);
            border-bottom-right-radius: 2px;
        }

        .message.received .message-content {
            background: var(--message-received);
            border-bottom-left-radius: 2px;
        }

        .message-sender {
            font-weight: 600;
            font-size: 13px;
            color: var(--primary-color);
            margin-bottom: 4px;
        }

        .message-text {
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message-time {
            font-size: 11px;
            color: #999;
            text-align: right;
            margin-top: 4px;
        }

        .typing-indicator {
            padding: 8px 12px;
            background: white;
            border-radius: 18px;
            display: inline-flex;
            gap: 4px;
            align-items: center;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--typing-color);
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        /* Compose área */
        .compose-area {
            padding: 12px 20px;
            background: white;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .compose-input {
            flex: 1;
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 10px 15px;
            resize: none;
            max-height: 120px;
            font-size: 14px;
            outline: none;
        }

        .compose-input:focus {
            border-color: var(--primary-color);
        }

        .compose-actions {
            display: flex;
            gap: 8px;
        }

        .compose-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .compose-btn:hover {
            background: #0052a3;
        }

        /* Empty state */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #999;
            gap: 15px;
        }

        .empty-state i {
            font-size: 80px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .conversations-sidebar {
                width: 100%;
            }

            .chat-area {
                display: none;
            }

            .chat-area.active {
                display: flex;
                position: absolute;
                left: 0;
                right: 0;
                top: 0;
                bottom: 0;
                z-index: 10;
            }
        }

        /* Modals */
        .modal-header {
            background: var(--primary-color);
            color: white;
        }

        /* Loading overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="messaging-container">
        <!-- Sidebar de conversaciones -->
        <div class="conversations-sidebar">
            <div class="sidebar-header">
                <h5><i class="bi bi-chat-dots-fill me-2"></i>Mensajería</h5>
                <button class="btn btn-sm btn-light" id="newConversationBtn" title="Nueva conversación">
                    <i class="bi bi-pencil-square"></i>
                </button>
            </div>

            <div class="search-box">
                <input type="text" id="conversationsSearch" placeholder="Buscar conversaciones...">
            </div>

            <div class="conversations-list" id="conversationsList">
                <!-- Conversaciones se cargan dinámicamente -->
            </div>
        </div>

        <!-- Área de chat -->
        <div class="chat-area" id="chatArea">
            <!-- Empty state (sin conversación seleccionada) -->
            <div class="empty-state" id="emptyState">
                <i class="bi bi-chat-text"></i>
                <h4>Selecciona una conversación</h4>
                <p>O inicia una nueva conversación</p>
            </div>

            <!-- Chat activo -->
            <div id="activeChat" class="hidden" style="display: flex; flex-direction: column; flex: 1;">
                <div class="chat-header">
                    <div class="chat-header-info">
                        <div class="conversation-avatar" id="chatAvatar">?</div>
                        <div>
                            <div class="chat-header-title" id="chatTitle">Conversación</div>
                            <div class="chat-header-subtitle" id="chatSubtitle">Online</div>
                        </div>
                    </div>
                    <div>
                        <button class="btn btn-sm btn-outline-secondary" id="chatSettingsBtn" title="Configuraciones">
                            <i class="bi bi-gear"></i>
                        </button>
                    </div>
                </div>

                <div class="messages-container" id="messagesContainer">
                    <!-- Mensajes se cargan dinámicamente -->
                </div>

                <div id="typingIndicatorContainer" class="px-3 pb-2 hidden">
                    <div class="typing-indicator">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>

                <div class="compose-area">
                    <input type="file" id="attachmentInput" class="d-none" accept="image/*,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
                    <button class="compose-btn" id="attachmentBtn" title="Adjuntar archivo">
                        <i class="bi bi-paperclip"></i>
                    </button>
                    <textarea
                        id="messageInput"
                        class="compose-input"
                        placeholder="Escribe un mensaje..."
                        rows="1"></textarea>
                    <button class="compose-btn" id="sendMessageBtn" title="Enviar">
                        <i class="bi bi-send-fill"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Nueva Conversación -->
    <div class="modal fade" id="newConversationModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Nueva Conversación</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="newConversationForm">
                        <div class="mb-3">
                            <label class="form-label">Tipo de conversación</label>
                            <select class="form-select" id="conversationType" required>
                                <option value="direct">Directa (1:1)</option>
                                <option value="group">Grupal</option>
                            </select>
                        </div>
                        <div class="mb-3" id="groupTitleField" style="display: none;">
                            <label class="form-label">Título del grupo</label>
                            <input type="text" class="form-control" id="groupTitle" placeholder="Ej: Equipo de Matemáticas">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Participantes</label>
                            <select class="form-select" id="participantsSelect" multiple size="5" required>
                                <!-- Se llena dinámicamente -->
                            </select>
                            <small class="form-text text-muted">Mantén Ctrl para seleccionar múltiples</small>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="createConversationBtn">Crear</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay hidden" id="loadingOverlay">
        <div class="spinner-border text-light" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 🔧 MAIN.JS - CARGA DINÁMICA DE HEADER Y FOOTER -->
    <script src="js/main.js"></script>

    <!-- Messaging Manager -->
    <script src="js/messaging-manager.js"></script>
</body>
</html>
