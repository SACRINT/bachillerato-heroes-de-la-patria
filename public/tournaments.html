<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torneos y Eventos | <span data-tenant-field="school_short_name">nuestro plantel</span></title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/tournaments.css">

    <!-- PWA y Metadatos -->
    <meta name="theme-color" content="#0d6efd">
    <link rel="apple-touch-icon" href="/images/logo-bachillerato-HDLP.webp">
    <!-- Global Header/Footer Styles -->
    <link rel="stylesheet" href="css/global-layout.css">
    <link rel="stylesheet" href="css/header-styles.css?v=2025111802">
    <link rel="stylesheet" href="css/footer-styles.css?v=2025111802">
    <script src="js/main.js" defer></script>
</head>

<body>
    <!-- Main Universal Header -->
    <header id="main-header"></header>

    <nav class="navbar navbar-dark bg-transparent px-4 fixed-top">
        <a class="navbar-brand fw-bold" href="iacoins-dashboard.html">
            <i class="fas fa-chevron-left me-2"></i> Dashboard
        </a>
    </nav>

    <header class="tournament-hero">
        <h1 class="display-4 fw-bold mb-3"><i class="fas fa-fire-alt text-danger me-2"></i> Torneos Activos</h1>
        <p class="lead text-light opacity-75">Participa, compite y gana recompensas exclusivas por tiempo limitado.</p>
    </header>

    <div class="container py-5 container-narrow">
        <div id="tournaments-list">
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status" title="Buscando eventos"></div>
                <p class="mt-2 text-muted">Buscando eventos...</p>
            </div>
        </div>
    </div>

    <!-- Leaderboard Modal -->
    <div class="modal fade" id="tournamentLbModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-list-ol text-warning me-2"></i> Clasificación del Torneo
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body p-0">
                    <div id="modal-lb-content" class="list-group list-group-flush bg-transparent">
                        <!-- Items injected here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/tournaments-viewer.js"></script>
    <script src="js/tenant-config-loader.js"></script>
    <script src="js/tenant-content-binder.js"></script>
</body>

</html>
