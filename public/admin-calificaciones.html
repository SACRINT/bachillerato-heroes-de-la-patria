<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1976D2">
    <title>Captura de Calificaciones | Admin Portal</title>

    <!-- Favicon -->
    <link rel="icon" href="/images/logo/logo-general-bge.webp" type="image/webp">
    <link rel="apple-touch-icon" href="/images/logo/logo-general-bge.webp">

    <!-- CSS Dependencies -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/global-layout.css">
    <link rel="stylesheet" href="css/header-styles.css?v=2025111802">
    <link rel="stylesheet" href="css/footer-styles.css?v=2025111802">

    <!-- Custom Styles for Grid -->
    <link rel="stylesheet" href="css/admin-style.css">
    <!-- Multi-tenant Dynamic Config & Binder -->
    <script src="js/tenant-config-loader.js"></script>
    <script src="js/tenant-content-binder.js"></script>
</head>

<body class="bg-light">

    <!-- Auth Check -->
    <script src="js/dashboard/dashboard-auth-check.js"></script>

    <!-- Header -->
    <header id="main-header"></header>
    <script src="js/dashboard/load-admin-header.js"></script>

    <!-- Main Content -->
    <main class="container py-5 main-content-adjusted">

        <!-- Header Section -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 mb-0 text-primary fw-bold">
                    <i class="fas fa-edit me-2"></i>Captura de Calificaciones
                </h1>
                <p class="text-muted mb-0">Gestión de evaluaciones y seguimiento académico</p>
            </div>
            <div>
                <a href="admin-dashboard.html" class="btn btn-outline-secondary btn-sm">
                    <i class="fas fa-arrow-left me-1"></i>Volver al Dashboard
                </a>
            </div>
        </div>

        <!-- Toolbar: Selectors -->
        <div class="card mb-4 border-0 shadow-sm">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="periodSelect" class="form-label fw-bold">Periodo de Evaluación</label>
                        <select id="periodSelect" class="form-select" disabled>
                            <option value="">Cargando periodos...</option>
                        </select>
                    </div>
                    <div class="col-md-5">
                        <label for="subjectSelect" class="form-label fw-bold">Materia / Grupo</label>
                        <select id="subjectSelect" class="form-select" disabled>
                            <option value="">Cargando materias...</option>
                        </select>
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <button id="refreshBtn" class="btn btn-primary w-100" disabled>
                            <i class="fas fa-sync-alt me-2"></i>Cargar Lista
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <!-- Grades Grid -->
        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div id="gradesGrid" class="table-responsive table-responsive-70vh">
                    <div class="text-center py-5 text-muted">
                        <i class="fas fa-chalkboard-teacher fa-3x mb-3 text-secondary opacity-50"></i>
                        <h5>Seleccione una Materia y un Periodo</h5>
                        <p>Los estudiantes aparecerán aquí para la captura de calificaciones.</p>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- Loading Spinner -->
    <div id="loadingSpinner">
        <div class="text-center">
            <div class="spinner-border text-primary mb-2" role="status"></div>
            <div class="fw-bold text-primary">Procesando...</div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core logic -->
    <script src="js/admin-grades.js"></script>

    <!-- Footer (Optional, can be skipped for cleaner app-like feel or included) -->
    <!-- <script src="js/dashboard/load-admin-footer.js"></script> -->

        <footer id="main-footer"></footer>

<script src="js/main.js" defer></script>
</body>

</html>
