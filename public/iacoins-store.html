<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛍️ Tienda IA Coins - BGE Héroes de la Patria</title>
    <meta name="description" content="Compra paquetes de IA Coins y adquiere ítems exclusivos en el Bachillerato General Héroes de la Patria">

    <!-- Bootstrap 5.3.2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6.4.0 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Global Header/Footer Styles -->
    <link rel="stylesheet" href="css/global-layout.css">
    <link rel="stylesheet" href="css/header-styles.css?v=2025111802">
    <link rel="stylesheet" href="css/footer-styles.css?v=2025111802">
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background-color: #0f172a;
            color: #f1f5f9;
            min-height: 100vh;
            padding-top: 75px;
            font-family: 'Roboto', sans-serif;
        }

        .store-container {
            padding: 2rem 1rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .page-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .page-header h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.75rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .page-header p {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        /* Wallet Banner */
        .wallet-banner {
            background: linear-gradient(135deg, #1e293b, #334155);
            border: 2px solid #fbbf24;
            border-radius: 16px;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            box-shadow: 0 10px 25px -5px rgba(251, 191, 36, 0.2);
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .wallet-balance {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .wallet-balance .icon {
            font-size: 3rem;
            color: #fbbf24;
        }

        .wallet-balance .info h3 {
            font-size: 0.95rem;
            color: #94a3b8;
            margin: 0 0 0.25rem 0;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .wallet-balance .amount {
            font-size: 2.25rem;
            font-weight: 800;
            color: #ffffff;
            line-height: 1;
        }

        .btn-refresh {
            background: rgba(251, 191, 36, 0.15);
            border: 1px solid #fbbf24;
            color: #fbbf24;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-refresh:hover {
            background: #fbbf24;
            color: #0f172a;
            transform: scale(1.05);
        }

        /* Section Titles */
        .section-title {
            margin-bottom: 1.5rem;
        }

        .section-title h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.75rem;
            font-weight: 700;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        /* Packages Grid */
        .packages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3.5rem;
        }

        .package-card {
            background: #1e293b;
            border: 2px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            transition: all 0.3s ease;
        }

        .package-card:hover {
            transform: translateY(-8px);
            border-color: #6366f1;
            box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.3);
        }

        .package-card.featured {
            border-color: #fbbf24;
            background: linear-gradient(135deg, #1e293b 0%, #292524 100%);
            box-shadow: 0 10px 25px -5px rgba(251, 191, 36, 0.3);
        }

        .package-badge {
            position: absolute;
            top: -12px;
            right: 20px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #0f172a;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .package-header h3 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .package-iacoins {
            font-size: 2rem;
            font-weight: 800;
            color: #fbbf24;
            margin-bottom: 0.5rem;
        }

        .package-price {
            font-size: 1rem;
            color: #94a3b8;
            margin-bottom: 0.5rem;
        }

        .package-bonus {
            display: inline-block;
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid #10b981;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
        }

        .package-features {
            list-style: none;
            padding: 0;
            margin: 0 0 1.5rem 0;
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        .package-features li {
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .package-features li i {
            color: #10b981;
        }

        .btn-purchase {
            width: 100%;
            padding: 0.75rem;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-purchase:hover {
            background: #4f46e5;
            transform: scale(1.02);
        }

        .btn-purchase.featured {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #0f172a;
        }

        .btn-purchase.featured:hover {
            box-shadow: 0 5px 15px rgba(251, 191, 36, 0.4);
        }

        /* Items Grid */
        .store-items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .item-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .item-card:hover {
            border-color: #fbbf24;
            transform: translateY(-4px);
        }

        .item-icon {
            font-size: 3rem;
            margin-bottom: 0.75rem;
        }

        .item-name {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .item-description {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            min-height: 40px;
        }

        .item-price {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fbbf24;
            margin-bottom: 1rem;
        }

        .btn-buy-item {
            width: 100%;
            padding: 0.6rem;
            background: #334155;
            color: #f1f5f9;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-buy-item:hover {
            background: #fbbf24;
            color: #0f172a;
            border-color: #fbbf24;
        }

        /* Payment Methods Modal */
        .modal-content {
            background: #1e293b;
            color: #f1f5f9;
            border: 1px solid #475569;
            border-radius: 16px;
        }

        .payment-methods {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin: 1.5rem 0;
        }

        .payment-method {
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .payment-method:hover {
            border-color: #6366f1;
        }

        .payment-method.active {
            border-color: #fbbf24;
            background: rgba(251, 191, 36, 0.1);
        }

        .payment-method i {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            display: block;
        }
    </style>
    <!-- DOMPurify -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <script src="js/main.js" defer></script>
</head>

<body>
    <!-- Universal Header -->
    <header id="main-header"></header>

    <div class="container store-container">
        <!-- Página Header -->
        <div class="page-header">
            <h1><i class="fas fa-store"></i> Tienda IA Coins</h1>
            <p>Adquiere paquetes de IA Coins y desbloquea items, avatares y recompensas en toda la plataforma</p>
        </div>

        <!-- Wallet Banner -->
        <div class="wallet-banner">
            <div class="wallet-balance">
                <div class="icon">
                    <i class="fas fa-coins"></i>
                </div>
                <div class="info">
                    <h3>Tu Saldo Disponible</h3>
                    <div class="amount">
                        <span id="currentBalance">250.00</span>
                        <small style="font-size: 0.9rem; color: #fbbf24; margin-left: 0.5rem;">🪙 IACoins</small>
                    </div>
                </div>
            </div>
            <button class="btn-refresh" data-action="load-wallet-balance">
                <i class="fas fa-sync-alt"></i> Actualizar Saldo
            </button>
        </div>

        <!-- Paquetes de IA Coins -->
        <div class="section-title">
            <h2><i class="fas fa-box-open text-warning"></i> Paquetes de IA Coins</h2>
        </div>

        <div class="packages-grid" id="packagesContainer">
            <!-- Rendered via JS -->
        </div>

        <!-- Items de la Tienda -->
        <div class="section-title">
            <h2><i class="fas fa-gift text-info"></i> Items Especiales y Mejoras</h2>
        </div>

        <div class="store-items-grid" id="storeItemsContainer">
            <!-- Rendered via JS -->
        </div>
    </div>

    <!-- Modal de Compra -->
    <div class="modal fade" id="purchaseModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title"><i class="fas fa-shopping-cart text-warning me-2"></i> Completar Compra</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div class="text-center mb-4">
                        <h4 id="modalPackageName" class="text-warning fw-bold">Paquete</h4>
                        <div id="modalPackageCoins" class="fs-3 fw-bold text-light mb-1">0 IA Coins</div>
                        <div id="modalPackageBonus"></div>
                        <div id="modalPackagePrice" class="fs-5 text-muted">$0.00 USD</div>
                    </div>

                    <h6 class="mb-3 text-secondary text-uppercase small fw-bold">Selecciona Método de Pago</h6>
                    <div class="payment-methods">
                        <div class="payment-method active" data-method="card">
                            <i class="fas fa-credit-card text-primary"></i>
                            <div class="small fw-bold">Tarjeta</div>
                        </div>
                        <div class="payment-method" data-method="oxxo">
                            <i class="fas fa-store text-danger"></i>
                            <div class="small fw-bold">OXXO Pay</div>
                        </div>
                        <div class="payment-method" data-method="paypal">
                            <i class="fab fa-paypal text-info"></i>
                            <div class="small fw-bold">PayPal</div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-warning fw-bold px-4" id="btnConfirmPurchase">
                        <i class="fas fa-lock me-1"></i> Pagar con Seguridad
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/tenant-config-loader.js" defer></script>

    <script>
        const PACKAGES = [
            {
                id: 'starter',
                name: 'Paquete Novato',
                iacoins: 100,
                bonus_percentage: 0,
                price_usd: 2.99,
                price_mxn: 59,
                features: ['100 IA Coins inmediatas', 'Acceso a retos diarios', 'Desbloqueo de avatares básicos'],
                featured: false
            },
            {
                id: 'pro',
                name: 'Paquete Académico',
                iacoins: 500,
                bonus_percentage: 20,
                price_usd: 9.99,
                price_mxn: 199,
                features: ['600 IA Coins (+20% Gratis)', 'Acceso a todos los torneos', 'Insignia de Estudiante Destacado', 'Sin límites de pistas'],
                featured: true
            },
            {
                id: 'master',
                name: 'Paquete Maestro',
                iacoins: 1500,
                bonus_percentage: 40,
                price_usd: 24.99,
                price_mxn: 499,
                features: ['2,100 IA Coins (+40% Gratis)', 'Todos los avatares y marcos VIP', 'Acceso prioritario a laboratorios VR', 'Multiplicador de XP x2 permanente'],
                featured: false
            }
        ];

        const STORE_ITEMS = [
            {
                id: 1,
                name: 'Avatar Premium VIP',
                description: 'Personaliza tu perfil con avatares holográficos exclusivos',
                icon: '🎭',
                price_iacoins: 50,
                category: 'customization'
            },
            {
                id: 2,
                name: 'Tema Oscuro Cyber',
                description: 'Desbloquea el tema visual Neón Cyber para tu dashboard',
                icon: '🌙',
                price_iacoins: 30,
                category: 'customization'
            },
            {
                id: 3,
                name: 'Certificado Digital Verificado',
                description: 'Emite un certificado criptográfico con código QR de tus logros',
                icon: '📜',
                price_iacoins: 100,
                category: 'rewards'
            },
            {
                id: 4,
                name: 'Multiplicador de XP x2 (7 días)',
                description: 'Duplica toda la experiencia ganada en duelos y lecciones',
                icon: '⚡',
                price_iacoins: 80,
                category: 'boost'
            }
        ];

        let currentPackage = null;
        let selectedPaymentMethod = 'card';

        function getStoredToken() {
            return sessionStorage.getItem('bge_auth_token') ||
                   localStorage.getItem('bge_auth_token') ||
                   sessionStorage.getItem('authToken') ||
                   localStorage.getItem('authToken') || '';
        }

        // Cargar Saldo de Billetera
        async function loadWalletBalance() {
            let balance = parseFloat(localStorage.getItem('bge_iacoins_balance') || '250.00');

            const token = getStoredToken();
            if (token) {
                try {
                    const response = await fetch('/api/iacoins/balance', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (response.ok) {
                        const data = await response.json();
                        if (data && data.data && typeof data.data.balance === 'number') {
                            balance = data.data.balance;
                            localStorage.setItem('bge_iacoins_balance', balance);
                        }
                    }
                } catch (e) {}
            }

            document.getElementById('currentBalance').textContent = balance.toFixed(2);
        }

        // Renderizar Paquetes
        function renderPackages() {
            const container = document.getElementById('packagesContainer');
            if (!container) return;
            container.innerHTML = '';

            PACKAGES.forEach(pkg => {
                const totalCoins = Math.floor(pkg.iacoins * (1 + pkg.bonus_percentage / 100));
                const card = document.createElement('div');
                card.className = pkg.featured ? 'package-card featured' : 'package-card';

                card.innerHTML = `
                    ${pkg.featured ? '<div class="package-badge">Más Popular</div>' : ''}
                    <div class="package-header">
                        <h3>${pkg.name}</h3>
                        <div class="package-iacoins"><i class="fas fa-coins text-warning"></i> ${totalCoins}</div>
                        <div class="package-price">$${pkg.price_usd.toFixed(2)} USD / $${pkg.price_mxn} MXN</div>
                        ${pkg.bonus_percentage > 0 ? `<div class="package-bonus">+${pkg.bonus_percentage}% BONUS</div>` : ''}
                    </div>
                    <ul class="package-features">
                        ${pkg.features.map(f => `<li><i class="fas fa-check-circle"></i> ${f}</li>`).join('')}
                    </ul>
                    <button class="${pkg.featured ? 'btn-purchase featured' : 'btn-purchase'}" data-action="open-purchase-modal" data-package-id="${pkg.id}">
                        <i class="fas fa-shopping-cart me-1"></i> Comprar Paquete
                    </button>
                `;
                container.appendChild(card);
            });
        }

        // Abrir Modal de Compra
        function openPurchaseModal(packageId) {
            const pkg = PACKAGES.find(p => p.id === packageId);
            if (!pkg) return;

            currentPackage = pkg;
            const totalCoins = Math.floor(pkg.iacoins * (1 + pkg.bonus_percentage / 100));

            document.getElementById('modalPackageName').textContent = pkg.name;
            document.getElementById('modalPackageCoins').innerHTML = `<i class="fas fa-coins text-warning me-1"></i> ${totalCoins} IA Coins`;
            document.getElementById('modalPackagePrice').textContent = `$${pkg.price_usd.toFixed(2)} USD / $${pkg.price_mxn} MXN`;
            document.getElementById('modalPackageBonus').innerHTML = pkg.bonus_percentage > 0
                ? `<span class="badge bg-success mb-2">+${pkg.bonus_percentage}% IACoins Gratis</span>`
                : '';

            const modal = new bootstrap.Modal(document.getElementById('purchaseModal'));
            modal.show();
        }

        // Renderizar Items de Tienda
        function renderStoreItems(items) {
            const container = document.getElementById('storeItemsContainer');
            if (!container) return;
            container.innerHTML = '';

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';

                card.innerHTML = `
                    <div>
                        <div class="item-icon">${item.icon}</div>
                        <div class="item-name">${item.name}</div>
                        <div class="item-description">${item.description}</div>
                    </div>
                    <div>
                        <div class="item-price"><i class="fas fa-coins text-warning"></i> ${item.price_iacoins} IACoins</div>
                        <button class="btn-buy-item" data-action="buy-item" data-item-id="${item.id}" data-item-name="${item.name}" data-item-price="${item.price_iacoins}">
                            <i class="fas fa-shopping-bag me-1"></i> Comprar Item
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Comprar Item Especial
        async function buyItem(itemId, itemName, price) {
            let currentBal = parseFloat(localStorage.getItem('bge_iacoins_balance') || '250.00');

            if (currentBal < price) {
                alert(`Saldo insuficiente. Necesitas ${price} IACoins para adquirir "${itemName}".\nTu saldo actual es de ${currentBal.toFixed(2)} IACoins.`);
                return;
            }

            if (!confirm(`¿Deseas comprar "${itemName}" por ${price} IA Coins?`)) {
                return;
            }

            const token = getStoredToken();
            if (token) {
                try {
                    await fetch('/api/wallet/spend', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + token
                        },
                        body: JSON.stringify({
                            amount: price,
                            description: 'Compra de tienda: ' + itemName,
                            metadata: { itemId, itemName }
                        })
                    });
                } catch (e) {
                    console.warn('[STORE] API spend error:', e);
                }
            }

            // Deduct local balance
            currentBal -= price;
            localStorage.setItem('bge_iacoins_balance', currentBal);

            // Record purchase
            const ownedItems = JSON.parse(localStorage.getItem('bge_store_purchases') || '[]');
            ownedItems.push({ id: itemId, name: itemName, date: new Date().toISOString() });
            localStorage.setItem('bge_store_purchases', JSON.stringify(ownedItems));

            alert(`🎉 ¡Compra exitosa!\n\nItem adquirido: ${itemName}\nNuevo Saldo: ${currentBal.toFixed(2)} IA Coins`);
            loadWalletBalance();
        }

        // Confirmar Compra de Paquete
        document.getElementById('btnConfirmPurchase').addEventListener('click', async function () {
            if (!currentPackage) return;

            const totalCoins = Math.floor(currentPackage.iacoins * (1 + currentPackage.bonus_percentage / 100));
            const token = getStoredToken();

            if (token) {
                try {
                    await fetch('/api/wallet/earn', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + token
                        },
                        body: JSON.stringify({
                            amount: totalCoins,
                            description: `Recarga de paquete: ${currentPackage.name} (${selectedPaymentMethod.toUpperCase()})`,
                            metadata: { packageId: currentPackage.id, paymentMethod: selectedPaymentMethod }
                        })
                    });
                } catch (e) {
                    console.warn('[STORE] API recharge error:', e);
                }
            }

            // Award coins locally
            let currentBal = parseFloat(localStorage.getItem('bge_iacoins_balance') || '250.00');
            currentBal += totalCoins;
            localStorage.setItem('bge_iacoins_balance', currentBal);

            alert(`🎉 ¡Pago procesado con éxito via ${selectedPaymentMethod.toUpperCase()}!\n\nSe han acreditado +${totalCoins} IA Coins a tu cuenta.\nNuevo saldo: ${currentBal.toFixed(2)} IACoins`);

            const modalInstance = bootstrap.Modal.getInstance(document.getElementById('purchaseModal'));
            if (modalInstance) modalInstance.hide();

            loadWalletBalance();
        });

        // Selección de Método de Pago
        document.querySelectorAll('.payment-method').forEach(method => {
            method.addEventListener('click', function () {
                document.querySelectorAll('.payment-method').forEach(m => m.classList.remove('active'));
                this.classList.add('active');
                selectedPaymentMethod = this.dataset.method;
            });
        });

        // Event Delegation
        document.addEventListener('click', function (e) {
            const actionElement = e.target.closest('[data-action]');
            if (!actionElement) return;

            const action = actionElement.dataset.action;

            if (action === 'load-wallet-balance') {
                loadWalletBalance();
            } else if (action === 'open-purchase-modal') {
                const pkgId = actionElement.dataset.packageId;
                if (pkgId) openPurchaseModal(pkgId);
            } else if (action === 'buy-item') {
                const itemId = parseInt(actionElement.dataset.itemId);
                const itemName = actionElement.dataset.itemName;
                const itemPrice = parseInt(actionElement.dataset.itemPrice);
                if (itemId && itemName && itemPrice) {
                    buyItem(itemId, itemName, itemPrice);
                }
            }
        });

        // Inicialización
        document.addEventListener('DOMContentLoaded', function () {
            renderPackages();
            renderStoreItems(STORE_ITEMS);
            loadWalletBalance();
        });
    </script>
</body>

</html>
