<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛍️ Tienda IA Coins - BGE <span data-tenant-field="school_short_name">nuestro plantel</span></title>
    <meta name="description" id="page-description" data-tenant-field="mision" content="Bachillerato General - Educación media superior de calidad." >

    <!-- Bootstrap 5.3.2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6.4.0 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Global Header/Footer Styles -->
    <link rel="stylesheet" href="css/global-layout.css">
    <link rel="stylesheet" href="css/header-styles.css?v=2025111802">
    <link rel="stylesheet" href="css/footer-styles.css?v=2025111802">
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background-color: #0f172a;
            color: #f1f5f9;
            min-height: 100vh;
            padding-top: 75px;
            font-family: 'Roboto', sans-serif;
        }

        .store-container {
            padding: 2rem 1rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .page-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .page-header h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.75rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .page-header p {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        /* Wallet Banner */
        .wallet-banner {
            background: linear-gradient(135deg, #1e293b, #334155);
            border: 2px solid #fbbf24;
            border-radius: 16px;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            box-shadow: 0 10px 25px -5px rgba(251, 191, 36, 0.2);
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .wallet-balance {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .wallet-balance .icon {
            font-size: 3rem;
            color: #fbbf24;
        }

        .wallet-balance .info h3 {
            font-size: 0.95rem;
            color: #94a3b8;
            margin: 0 0 0.25rem 0;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .wallet-balance .amount {
            font-size: 2.25rem;
            font-weight: 800;
            color: #ffffff;
            line-height: 1;
        }

        .btn-refresh {
            background: rgba(251, 191, 36, 0.15);
            border: 1px solid #fbbf24;
            color: #fbbf24;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-refresh:hover {
            background: #fbbf24;
            color: #0f172a;
            transform: scale(1.05);
        }

        /* Section Titles */
        .section-title {
            margin-bottom: 1.5rem;
        }

        .section-title h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.75rem;
            font-weight: 700;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        /* Packages Grid */
        .packages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3.5rem;
        }

        .package-card {
            background: #1e293b;
            border: 2px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            transition: all 0.3s ease;
        }

        .package-card:hover {
            transform: translateY(-8px);
            border-color: #6366f1;
            box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.3);
        }

        .package-card.featured {
            border-color: #fbbf24;
            background: linear-gradient(135deg, #1e293b 0%, #292524 100%);
            box-shadow: 0 10px 25px -5px rgba(251, 191, 36, 0.3);
        }

        .package-badge {
            position: absolute;
            top: -12px;
            right: 20px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #0f172a;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .package-header h3 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .package-iacoins {
            font-size: 2rem;
            font-weight: 800;
            color: #fbbf24;
            margin-bottom: 0.5rem;
        }

        .package-price {
            font-size: 1rem;
            color: #94a3b8;
            margin-bottom: 0.5rem;
        }

        .package-bonus {
            display: inline-block;
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid #10b981;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
        }

        .package-features {
            list-style: none;
            padding: 0;
            margin: 0 0 1.5rem 0;
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        .package-features li {
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .package-features li i {
            color: #10b981;
        }

        .btn-purchase {
            width: 100%;
            padding: 0.75rem;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-purchase:hover {
            background: #4f46e5;
            transform: scale(1.02);
        }

        .btn-purchase.featured {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #0f172a;
        }

        .btn-purchase.featured:hover {
            box-shadow: 0 5px 15px rgba(251, 191, 36, 0.4);
        }

        /* Items Grid */
        .store-items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .item-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .item-card:hover {
            border-color: #fbbf24;
            transform: translateY(-4px);
        }

        .item-icon {
            font-size: 3rem;
            margin-bottom: 0.75rem;
        }

        .item-name {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .item-description {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            min-height: 40px;
        }

        .item-price {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fbbf24;
            margin-bottom: 1rem;
        }

        .btn-buy-item {
            width: 100%;
            padding: 0.6rem;
            background: #334155;
            color: #f1f5f9;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-buy-item:hover {
            background: #fbbf24;
            color: #0f172a;
            border-color: #fbbf24;
        }

        /* Payment Methods Modal */
        .modal-content {
            background: #1e293b;
            color: #f1f5f9;
            border: 1px solid #475569;
            border-radius: 16px;
        }

        .payment-methods {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin: 1.5rem 0;
        }

        .payment-method {
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .payment-method:hover {
            border-color: #6366f1;
        }

        .payment-method.active {
            border-color: #fbbf24;
            background: rgba(251, 191, 36, 0.1);
        }

        .payment-method i {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            display: block;
        }
    </style>
    <!-- DOMPurify -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <script src="js/main.js" defer></script>
</head>

<body>
    <!-- Universal Header -->
    <header id="main-header"></header>

    <div class="container store-container">
        <!-- Página Header -->
        <div class="page-header">
            <h1><i class="fas fa-store"></i> Tienda IA Coins</h1>
            <p>Adquiere paquetes de IA Coins y desbloquea items, avatares y recompensas en toda la plataforma</p>
        </div>

        <!-- Wallet Banner -->
        <div class="wallet-banner">
            <div class="wallet-balance">
                <div class="icon">
                    <i class="fas fa-coins"></i>
                </div>
                <div class="info">
                    <h3>Tu Saldo Disponible</h3>
                    <div class="amount">
                        <span id="currentBalance">250.00</span>
                        <small style="font-size: 0.9rem; color: #fbbf24; margin-left: 0.5rem;">🪙 IACoins</small>
                    </div>
                </div>
            </div>
            <button class="btn-refresh" data-action="load-wallet-balance">
                <i class="fas fa-sync-alt"></i> Actualizar Saldo
            </button>
        </div>

        <!-- Paquetes de IA Coins -->
        <div class="section-title">
            <h2><i class="fas fa-box-open text-warning"></i> Paquetes de IA Coins</h2>
        </div>

        <div class="packages-grid" id="packagesContainer">
            <!-- Rendered via JS -->
        </div>

        <!-- Items de la Tienda -->
        <div class="section-title">
            <h2><i class="fas fa-gift text-info"></i> Items Especiales y Mejoras</h2>
        </div>

        <div class="store-items-grid" id="storeItemsContainer">
            <!-- Rendered via JS -->
        </div>
    </div>

    <!-- Modal de Compra -->
    <div class="modal fade" id="purchaseModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title"><i class="fas fa-shopping-cart text-warning me-2"></i> Completar Compra</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div class="text-center mb-4">
                        <h4 id="modalPackageName" class="text-warning fw-bold">Paquete</h4>
                        <div id="modalPackageCoins" class="fs-3 fw-bold text-light mb-1">0 IA Coins</div>
                        <div id="modalPackageBonus"></div>
                        <div id="modalPackagePrice" class="fs-5 text-muted">$0.00 USD</div>
                    </div>

                    <h6 class="mb-3 text-secondary text-uppercase small fw-bold">Selecciona Método de Pago</h6>
                    <div class="payment-methods">
                        <div class="payment-method active" data-method="card">
                            <i class="fas fa-credit-card text-primary"></i>
                            <div class="small fw-bold">Tarjeta</div>
                        </div>
                        <div class="payment-method" data-method="oxxo">
                            <i class="fas fa-store text-danger"></i>
                            <div class="small fw-bold">OXXO Pay</div>
                        </div>
                        <div class="payment-method" data-method="paypal">
                            <i class="fab fa-paypal text-info"></i>
                            <div class="small fw-bold">PayPal</div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-warning fw-bold px-4" id="btnConfirmPurchase">
                        <i class="fas fa-lock me-1"></i> Pagar con Seguridad
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/tenant-config-loader.js"></script>
    <script src="js/tenant-content-binder.js"></script>

    <script src="js/inline/iacoins-store-inline-1.js"></script>
</body>

</html>
