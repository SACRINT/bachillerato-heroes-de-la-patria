<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 Retos y Logros - BGE Héroes de la Patria</title>

    <!-- Bootstrap 5.3.2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome 6.4.0 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Roboto:wght@300;400;500;700&display=swap"
        rel="stylesheet">

    <!-- ✅ FIX (2 Dec 2025): Header/Footer styles loaded globally -->
    <!-- These MUST be in <head> so they apply BEFORE dynamic header/footer injection -->
    <link rel="stylesheet" href="css/global-layout.css">
    <link rel="stylesheet" href="css/header-styles.css?v=2025111802">
    <link rel="stylesheet" href="css/footer-styles.css?v=2025111802">

    <!-- DOMPurify for XSS protection (MUST load before main.js) -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <!-- Main JS for dynamic header/footer loading -->


    <style>
        :root {
            --primary-color: #007bff;
            --secondary-color: #6c757d;
            --success-color: #28a745;
            --warning-color: #ffc107;
            --danger-color: #dc3545;
            --info-color: #17a2b8;
            --gold-color: #f59e0b;
            --purple-color: #8b5cf6;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 0;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: 'Montserrat', sans-serif;
        }

        .challenges-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .page-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            color: white;
        }

        .page-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .page-header p {
            font-size: 1.1rem;
            opacity: 0.9;
            margin: 0;
        }

        .filter-tabs {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .filter-tabs .nav-pills {
            justify-content: center;
        }

        .filter-tabs .nav-link {
            padding: 12px 30px;
            margin: 0 5px;
            border-radius: 50px;
            font-weight: 600;
            color: var(--secondary-color);
            transition: all 0.3s;
        }

        .filter-tabs .nav-link.active {
            background: linear-gradient(135deg, var(--primary-color), var(--purple-color));
            color: white;
        }

        .filter-tabs .nav-link:hover:not(.active) {
            background: rgba(0, 123, 255, 0.1);
        }

        .challenge-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .challenge-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
        }

        .challenge-card.daily::before {
            background: linear-gradient(90deg, #28a745, #20c997);
        }

        .challenge-card.weekly::before {
            background: linear-gradient(90deg, #007bff, #0056b3);
        }

        .challenge-card.monthly::before {
            background: linear-gradient(90deg, #8b5cf6, #6d28d9);
        }

        .challenge-card.achievement::before {
            background: linear-gradient(90deg, #f59e0b, #ff6b35);
        }

        .challenge-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .challenge-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .challenge-icon {
            font-size: 3rem;
            margin-right: 20px;
        }

        .challenge-info {
            flex: 1;
        }

        .challenge-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        .challenge-description {
            color: var(--secondary-color);
            margin-bottom: 10px;
        }

        .challenge-meta {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .meta-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .meta-badge.type-daily {
            background: rgba(40, 167, 69, 0.1);
            color: #28a745;
        }

        .meta-badge.type-weekly {
            background: rgba(0, 123, 255, 0.1);
            color: #007bff;
        }

        .meta-badge.type-monthly {
            background: rgba(139, 92, 246, 0.1);
            color: #8b5cf6;
        }

        .meta-badge.type-achievement {
            background: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
        }

        .meta-badge.reward {
            background: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
        }

        .challenge-rewards {
            display: flex;
            gap: 20px;
            padding: 15px;
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.05), rgba(255, 107, 53, 0.05));
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .reward-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: var(--gold-color);
        }

        .reward-item i {
            font-size: 1.5rem;
        }

        .challenge-progress {
            margin-bottom: 15px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: var(--secondary-color);
        }

        .progress {
            height: 25px;
            border-radius: 50px;
        }

        .progress-bar {
            background: linear-gradient(90deg, var(--success-color), #20c997);
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        .challenge-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn-complete {
            padding: 10px 25px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-complete:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.3);
        }

        .btn-completed {
            padding: 10px 25px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            background: var(--secondary-color);
            color: white;
            cursor: not-allowed;
        }

        .btn-view-details {
            padding: 10px 25px;
            border: 2px solid var(--primary-color);
            border-radius: 50px;
            font-weight: 600;
            background: transparent;
            color: var(--primary-color);
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-view-details:hover {
            background: var(--primary-color);
            color: white;
        }

        .challenge-time {
            position: absolute;
            top: 20px;
            right: 20px;
            background: white;
            padding: 10px 15px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .challenge-time .label {
            font-size: 0.8rem;
            color: var(--secondary-color);
        }

        .challenge-time .value {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--danger-color);
        }

        .empty-state {
            background: white;
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .empty-state i {
            font-size: 5rem;
            color: var(--secondary-color);
            opacity: 0.3;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            color: var(--secondary-color);
            margin-bottom: 10px;
        }

        .empty-state p {
            color: var(--secondary-color);
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            .page-header h1 {
                font-size: 1.8rem;
            }

            .challenge-header {
                flex-direction: column;
            }

            .challenge-time {
                position: static;
                margin-bottom: 15px;
            }

            .challenge-actions {
                flex-direction: column;
            }

            .filter-tabs .nav-pills {
                flex-direction: column;
            }

            .filter-tabs .nav-link {
                margin-bottom: 10px;
            }
        }
    </style>


    <!-- 🏢 Multi-Tenancy Support -->
    <script src="js/tenant-config-loader.js"></script>

    <!-- 🎯 BGE FRAMEWORK CORE & AUTH -->
    <script src="js/bge-framework-core.js"></script>

    <!-- DOMPurify XSS Protection -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <!-- tenant-replacer.js removed - functionality handled by tenant-config-loader.js -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Main JS for dynamic header/footer loading -->
    <script src="js/script.js" defer></script>
</head>

<body>
    <!-- Header will be injected here -->
    <header id="main-header"></header>
    <div class="container challenges-container">
        <!-- Page Header -->
        <div class="page-header">
            <h1><i class="fas fa-trophy"></i> Retos y Logros</h1>
            <p>Completa retos diarios, semanales y mensuales para ganar IA Coins y XP</p>
        </div>

        <!-- Filter Tabs -->
        <div class="filter-tabs">
            <ul class="nav nav-pills" id="challengeTypeTabs">
                <li class="nav-item">
                    <a class="nav-link active" href="#" data-type="all">
                        <i class="fas fa-th-large"></i> Todos
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" data-type="daily">
                        <i class="fas fa-sun"></i> Diarios
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" data-type="weekly">
                        <i class="fas fa-calendar-week"></i> Semanales
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" data-type="monthly">
                        <i class="fas fa-calendar-alt"></i> Mensuales
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" data-type="achievement">
                        <i class="fas fa-medal"></i> Logros
                    </a>
                </li>
            </ul>
        </div>

        <!-- Challenges List -->
        <div id="challengesContainer">
            <!-- Las tarjetas de retos se cargarán dinámicamente -->
        </div>
    </div>

    <!-- Bootstrap 5.3.2 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Footer will be injected here -->
    <footer id="main-footer"></footer>
    <script src="js/inline/challenges-inline-1.js"></script>
    <!-- Dark Mode Toggle -->
    <button class="dark-mode-toggle" id="darkModeToggle" aria-label="Alternar modo oscuro">
        <i class="fas fa-moon"></i>
    </button>



    <!-- Chat Bot Container -->

    <script src="js/chatbot.js"></script>
    <script src="js/main.js" defer></script>
</body>

</html>
