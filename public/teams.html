<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Competencias y Equipos | BGE Héroes</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/teams.css">

    <!-- PWA -->
    <link rel="icon" href="/images/logo-bachillerato-HDLP.webp" type="image/webp">
    <link rel="apple-touch-icon" href="/images/logo-bachillerato-HDLP.webp">
    <meta name="theme-color" content="#1e1b4b">
    <!-- Global Header/Footer Styles -->
    <link rel="stylesheet" href="css/global-layout.css">
    <link rel="stylesheet" href="css/header-styles.css?v=2025111802">
    <link rel="stylesheet" href="css/footer-styles.css?v=2025111802">
    <script src="js/main.js" defer></script>
</head>

<body>
    <!-- Main Universal Header -->
    <header id="main-header"></header>

    <!-- Navbar -->
    

    <!-- Hero -->
    <header class="teams-hero text-center">
        <div class="container">
            <h1 class="display-5 fw-bold mb-3">Torneos y Competencias</h1>
            <p class="lead opacity-75 mb-4">Únete a un equipo, compite en desafíos semanales y gana reconocimiento.</p>

            <div id="hero-actions">
                <!-- Injected via JS depending on if user has team -->
                <button class="btn btn-primary btn-lg px-5 shadow-sm" data-bs-toggle="modal"
                    data-bs-target="#createTeamModal">
                    <i class="fas fa-users me-2"></i> Crear Equipo
                </button>
            </div>
        </div>
    </header>

    <div class="container pb-5">

        <!-- Tabs -->
        <ul class="nav nav-pills mb-4" id="pills-tab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="pills-competitions-tab" data-bs-toggle="pill"
                    data-bs-target="#pills-competitions" type="button" role="tab" aria-controls="pills-competitions"
                    aria-selected="true">Torneos Activos</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="pills-myteam-tab" data-bs-toggle="pill" data-bs-target="#pills-myteam"
                    type="button" role="tab" aria-controls="pills-myteam" aria-selected="false">Mi Equipo</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="pills-leaderboard-tab" data-bs-toggle="pill"
                    data-bs-target="#pills-leaderboard" type="button" role="tab" aria-controls="pills-leaderboard"
                    aria-selected="false">Ranking Global</button>
            </li>
        </ul>

        <div class="tab-content" id="pills-tabContent">

            <!-- Tab: Competitions -->
            <div class="tab-pane fade show active" id="pills-competitions">
                <h4 class="fw-bold mb-4 text-dark">Próximos Torneos</h4>
                <div id="competitions-container">
                    <!-- Injected -->
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status" title="Buscando torneos"></div>
                    </div>
                </div>
            </div>

            <!-- Tab: My Team -->
            <div class="tab-pane fade" id="pills-myteam">
                <div id="my-team-container">
                    <!-- Injected -->
                </div>
            </div>

            <!-- Tab: Leaderboard -->
            <div class="tab-pane fade" id="pills-leaderboard">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-0">
                        <table class="table table-hover align-middle mb-0 leaderboard-table">
                            <thead class="bg-light">
                                <tr>
                                    <th class="ps-4">Rank</th>
                                    <th>Equipo</th>
                                    <th class="text-center">Victorias</th>
                                    <th class="text-end pe-4">Puntaje</th>
                                </tr>
                            </thead>
                            <tbody id="leaderboard-body">
                                <!-- Injected -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Create Team Modal -->
    <div class="modal fade" id="createTeamModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Fundar Nuevo Equipo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"
                        title="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <form id="create-team-form">
                        <div class="mb-3">
                            <label class="form-label" for="team-name">Nombre del Equipo</label>
                            <input type="text" class="form-control" id="team-name" required
                                placeholder="Ej. Los Cuánticos" title="Nombre del equipo">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="team-motto">Lema (Motto)</label>
                            <input type="text" class="form-control" id="team-motto" placeholder="Ej. Semper Fi"
                                title="Lema del equipo">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="team-avatar">URL del Escudo/Avatar</label>
                            <input type="url" class="form-control" id="team-avatar" title="URL del escudo o avatar"
                                placeholder="https://example.com/image.png">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary w-100" onclick="createTeam()">Crear Equipo</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/teams-viewer.js"></script>
    <script src="js/tenant-config-loader.js"></script>
    <script src="js/tenant-content-binder.js"></script>
</body>

</html>
