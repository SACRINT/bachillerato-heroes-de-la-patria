<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Learning | BGE <span data-tenant-field="school_short_name">nuestro plantel</span></title>

    <!-- Video.js / Plyr -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

    <!-- Styles -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/video-player.css">
    <style>
        .vh-100-main {
            height: 100vh;
        }

        .video-max-width {
            max-width: 1000px;
        }

        .sidebar-width {
            width: 350px;
        }
    </style>
    <!-- Global Header/Footer Styles -->
    <link rel="stylesheet" href="css/global-layout.css">
    <link rel="stylesheet" href="css/header-styles.css?v=2025111802">
    <link rel="stylesheet" href="css/footer-styles.css?v=2025111802">
    <script src="js/main.js" defer></script>
</head>

<body class="player-mode">
    <!-- Main Universal Header -->
    <header id="main-header"></header>

    <div class="d-flex h-100">
        <!-- Main Content (Video) -->
        <main class="flex-grow-1 d-flex flex-column vh-100-main">
            <header
                class="p-3 bg-dark border-bottom border-secondary d-flex justify-content-between align-items-center">
                <a href="estudiantes.html" class="text-white text-decoration-none" title="Volver al Portal Estudiantil"
                    aria-label="Volver al Portal Estudiantil">
                    <i class="fas fa-arrow-left me-2"></i> Volver
                </a>
                <h5 class="m-0 text-white" id="video-title">Cargando Lección...</h5>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-light btn-sm" onclick="toggleNotes()" title="Mostrar notas"
                        aria-label="Mostrar notas">
                        <i class="fas fa-sticky-note"></i> Notas
                    </button>
                </div>
            </header>

            <div class="flex-grow-1 d-flex align-items-center justify-content-center bg-black position-relative">
                <div class="video-container w-100 video-max-width">
                    <video id="player" playsinline controls>
                        <!-- Source injected via JS -->
                    </video>

                    <!-- Interaction Overlay -->
                    <div id="interaction-overlay" class="interaction-overlay">
                        <div class="interaction-card">
                            <i class="fas fa-question-circle fa-3x text-primary mb-3"></i>
                            <h3 id="interaction-title">Pregunta Rápida</h3>
                            <div id="interaction-content">
                                <!-- Dynamic Content -->
                            </div>
                            <button class="btn btn-primary mt-3 d-none" id="interaction-continue"
                                onclick="resumeVideo()">Continuar</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Sidebar (Chapters, Bookmarks) -->
        <aside class="player-sidebar sidebar-width">
            <nav class="nav nav-tabs nav-fill bg-dark border-secondary" id="sidebarTab" role="tablist">
                <button class="nav-link active text-white rounded-0 border-0 border-bottom" data-bs-toggle="tab"
                    data-bs-target="#chapters" type="button" role="tab" aria-controls="chapters"
                    aria-selected="true">Capítulos</button>
                <button class="nav-link text-white rounded-0 border-0" data-bs-toggle="tab" data-bs-target="#bookmarks"
                    type="button" role="tab" aria-controls="bookmarks" aria-selected="false">Marcadores</button>
            </nav>

            <div class="tab-content" id="sidebarTabContent">
                <div class="tab-pane fade show active" id="chapters">
                    <div class="list-group list-group-flush" id="chapters-list">
                        <!-- Dynamic Chapters -->
                    </div>
                </div>
                <div class="tab-pane fade" id="bookmarks">
                    <div class="p-3">
                        <div class="input-group mb-3">
                            <input type="text" class="form-control" placeholder="Nota rápida..." id="bookmark-note"
                                title="Nota rápida" aria-label="Nota rápida">
                            <button class="btn btn-primary" onclick="addBookmark()" title="Agregar marcador"
                                aria-label="Agregar marcador"><i class="fas fa-plus"></i></button>
                        </div>
                        <div id="bookmarks-list">
                            <!-- Dynamic Bookmarks -->
                        </div>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <!-- JS -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/video-player.js"></script>
    <script src="js/tenant-config-loader.js"></script>
    <script src="js/tenant-content-binder.js"></script>
</body>

</html>
