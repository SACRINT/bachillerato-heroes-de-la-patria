<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunidad y Foros | BGE Héroes</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/community.css">

    <!-- PWA -->
    <link rel="icon" href="/images/logo-bachillerato-HDLP.webp" type="image/webp">
    <link rel="apple-touch-icon" href="/images/logo-bachillerato-HDLP.webp">
    <meta name="theme-color" content="#2563eb">
    <!-- Global Header/Footer Styles -->
    <link rel="stylesheet" href="css/global-layout.css">
    <link rel="stylesheet" href="css/header-styles.css?v=2025111802">
    <link rel="stylesheet" href="css/footer-styles.css?v=2025111802">
    <script src="js/main.js" defer></script>
</head>

<body>
    <!-- Main Universal Header -->
    <header id="main-header"></header>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="estudiantes.html">
                <i class="fas fa-chevron-left me-2"></i> Comunidad Estudiantil
            </a>
        </div>
    </nav>

    <div class="container pb-5">

        <!-- Header -->
        <div class="forum-header-card d-flex justify-content-between align-items-center">
            <div>
                <h1 class="h3 fw-bold mb-1">Foros de Discusión</h1>
                <p class="text-muted mb-0">Resuelve dudas, comparte apuntes y conecta con compañeros.</p>
            </div>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newThreadModal">
                <i class="fas fa-plus me-2"></i> Nuevo Hilo
            </button>
        </div>

        <!-- Views Container -->
        <div id="view-container">
            <!-- 1. Categories View -->
            <div id="forum-list-view">
                <div class="text-center py-5" id="categories-loading">
                    <div class="spinner-border text-primary" role="status" title="Cargando categorías"></div>
                </div>
                <!-- Categories will be injected here -->
            </div>

            <!-- 2. Thread List View (Hidden by default) -->
            <div id="thread-list-view" class="d-none">
                <button class="btn btn-link text-decoration-none mb-3 ps-0" onclick="showCategories()">
                    <i class="fas fa-arrow-left me-1"></i> Volver a Foros
                </button>
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white border-bottom py-3">
                        <h4 class="mb-0 fw-bold" id="current-forum-title">Título Foro</h4>
                    </div>
                    <div id="threads-container">
                        <!-- Threads injected here -->
                    </div>
                </div>
            </div>

            <!-- 3. Thread Detail View (Hidden by default) -->
            <div id="thread-detail-view" class="d-none">
                <button class="btn btn-link text-decoration-none mb-3 ps-0" onclick="backToThreats()">
                    <i class="fas fa-arrow-left me-1"></i> Volver a la lista
                </button>

                <!-- Thread Main Post -->
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-body p-0" id="thread-detail-content">
                        <!-- Content injected here -->
                    </div>
                </div>

                <!-- Replies -->
                <h5 class="fw-bold mb-3"><span id="reply-count">0</span> Respuestas</h5>

                <div id="replies-container" class="mb-4">
                    <!-- Replies injected here -->
                </div>

                <!-- Reply Form -->
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h6 class="fw-bold mb-3">Tu Respuesta</h6>
                        <textarea class="form-control mb-3" rows="4" id="reply-input"
                            placeholder="Escribe tu solución o comentario aquí..."></textarea>
                        <div class="d-flex justify-content-end">
                            <button class="btn btn-primary" onclick="submitReply()">Publicar Respuesta</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- New Thread Modal -->
    <div class="modal fade" id="newThreadModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Crear Nuevo Hilo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="new-thread-form">
                        <div class="mb-3">
                            <label class="form-label">Foro / Categoría</label>
                            <select class="form-select" id="thread-category" required>
                                <!-- Populated dynamically -->
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Título</label>
                            <input type="text" class="form-control" id="thread-title"
                                placeholder="Ej. Duda con derivadas" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contenido</label>
                            <textarea class="form-control" rows="5" id="thread-content" required></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary w-100" onclick="createThread()">Publicar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/community-viewer.js"></script>
    <script src="js/tenant-config-loader.js" defer></script>
</body>

</html>
