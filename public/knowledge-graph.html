<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Mapa de Conocimiento | AI Learning Hub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <script src="https://d3js.org/d3.v7.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
            overflow: hidden;
            /* Fullscreen map */
        }

        #graph-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            background: linear-gradient(135deg, #f8f9fa 0%, #eef2ff 100%);
        }

        .overlay-ui {
            position: absolute;
            z-index: 10;
            pointer-events: none;
            /* Let clicks pass specific areas */
        }

        .overlay-ui>* {
            pointer-events: auto;
            /* Re-enable clicks on buttons */
        }

        .top-bar {
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-panel {
            position: absolute;
            right: -400px;
            /* Hidden */
            top: 80px;
            width: 350px;
            bottom: 20px;
            background: white;
            border-radius: 15px 0 0 15px;
            box-shadow: -5px 0 20px rgba(0, 0, 0, 0.1);
            transition: right 0.3s ease;
            overflow-y: auto;
            padding: 20px;
        }

        .info-panel.active {
            right: 0;
        }

        /* Tooltip */
        .tooltip-node {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .mastery-badge {
            font-size: 0.75rem;
            padding: 0.25em 0.6em;
            border-radius: 10rem;
        }

        .bg-low {
            background-color: #ffb703;
            color: #000;
        }

        .bg-med {
            background-color: #f72585;
            color: #fff;
        }

        .bg-high {
            background-color: #4361ee;
            color: #fff;
        }

        .bg-master {
            background-color: #4cc9f0;
            color: #000;
        }

        .bg-locked {
            background-color: #e9ecef;
            color: #6c757d;
        }
    </style>
</head>

<body>

    <div id="graph-container"></div>
    <div id="tooltip" class="tooltip-node"></div>

    <!-- UI Overlay -->
    <div class="overlay-ui top-bar">
        <div class="card shadow-sm border-0">
            <div class="card-body py-2 px-3 d-flex align-items-center">
                <a href="iacoins-dashboard.html" class="btn btn-sm btn-light me-3 rounded-circle">
                    <i class="fas fa-arrow-left"></i>
                </a>
                <h5 class="mb-0 fw-bold text-primary">
                    <i class="fas fa-project-diagram me-2"></i>Knowledge Graph
                </h5>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body py-2 px-3">
                <span class="badge bg-master me-2">Dominado</span>
                <span class="badge bg-high me-2">Avanzado</span>
                <span class="badge bg-med me-2">En Progreso</span>
                <span class="badge bg-low me-2">Básico</span>
                <span class="badge bg-locked">Bloqueado</span>
            </div>
        </div>
    </div>

    <!-- Right Side Panel -->
    <div id="info-panel" class="overlay-ui info-panel">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h5 class="fw-bold mb-0">Detalles del Tema</h5>
            <button class="btn btn-sm btn-light rounded-circle" onclick="closePanel()">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div id="panel-content">
            <!-- Content Injected via JS -->
            <div class="text-center py-5 text-muted">
                <i class="fas fa-mouse-pointer fa-2x mb-3"></i>
                <p>Haz clic en un nodo para ver detalles.</p>
            </div>
        </div>
    </div>

    <script>
        // D3 Graph Logic
        let simulation, svg, link, node, labels;
        const width = window.innerWidth;
        const height = window.innerHeight;

        async function initGraph() {
            const token = localStorage.getItem('student_auth_token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const res = await fetch('/api/knowledge/graph', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const json = await res.json();

                if (json.success) {
                    renderGraph(json.data);
                }
            } catch (error) {
                console.error("Error loading graph", error);
            }
        }

        function renderGraph(data) {
            const { nodes, edges } = data;

            // Prepare links (source/target used to be IDs, D3 needs references or indices if not careful, 
            // but D3 v6+ handles IDs if id accessor is set. However, safe bet is to map objects)
            // My backend returns source/target as IDs. D3 force can map these if configured.

            // Map edges to D3 format
            const links = edges.map(d => Object.create(d));
            const nodeList = nodes.map(d => Object.create(d));

            simulation = d3.forceSimulation(nodeList)
                .force("link", d3.forceLink(links).id(d => d.id).distance(150))
                .force("charge", d3.forceManyBody().strength(-400))
                .force("center", d3.forceCenter(width / 2, height / 2))
                .force("collide", d3.forceCollide().radius(d => d.value * 2));

            svg = d3.select("#graph-container").append("svg")
                .attr("viewBox", [0, 0, width, height])
                .call(d3.zoom().on("zoom", (event) => {
                    g.attr("transform", event.transform);
                }));

            const g = svg.append("g");

            // Define arrow markers
            svg.append("defs").selectAll("marker")
                .data(["end"])
                .enter().append("marker")
                .attr("id", "arrow")
                .attr("viewBox", "0 -5 10 10")
                .attr("refX", 25) // Offset to avoid overlapping node
                .attr("refY", 0)
                .attr("markerWidth", 6)
                .attr("markerHeight", 6)
                .attr("orient", "auto")
                .append("path")
                .attr("d", "M0,-5L10,0L0,5")
                .attr("fill", "#ced4da");

            link = g.append("g")
                .attr("stroke", "#999")
                .attr("stroke-opacity", 0.6)
                .selectAll("line")
                .data(links)
                .join("line")
                .attr("stroke-width", d => Math.sqrt(d.value || 1))
                .attr("stroke", d => d.color.color)
                .attr("marker-end", "url(#arrow)");

            node = g.append("g")
                .attr("stroke", "#fff")
                .attr("stroke-width", 2)
                .selectAll("circle")
                .data(nodeList)
                .join("circle")
                .attr("r", d => d.value)
                .attr("fill", d => d.color)
                .attr("cursor", "pointer")
                .call(drag(simulation));

            node.on("click", (event, d) => {
                showPanel(d);
                event.stopPropagation();
            });

            svg.on("click", () => closePanel()); // Close on blank click

            labels = g.append("g")
                .attr("class", "labels")
                .selectAll("text")
                .data(nodeList)
                .enter().append("text")
                .attr("dy", d => d.value + 15)
                .attr("text-anchor", "middle")
                .text(d => d.label)
                .attr("font-size", "12px")
                .attr("fill", "#495057")
                .style("pointer-events", "none")
                .style("text-shadow", "1px 1px 2px white");

            simulation.on("tick", () => {
                link
                    .attr("x1", d => d.source.x)
                    .attr("y1", d => d.source.y)
                    .attr("x2", d => d.target.x)
                    .attr("y2", d => d.target.y);

                node
                    .attr("cx", d => d.x)
                    .attr("cy", d => d.y);

                labels
                    .attr("x", d => d.x)
                    .attr("y", d => d.y);
            });
        }

        function drag(simulation) {
            function dragstarted(event) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                event.subject.fx = event.subject.x;
                event.subject.fy = event.subject.y;
            }

            function dragged(event) {
                event.subject.fx = event.x;
                event.subject.fy = event.y;
            }

            function dragended(event) {
                if (!event.active) simulation.alphaTarget(0);
                event.subject.fx = null;
                event.subject.fy = null;
            }

            return d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended);
        }

        function showPanel(nodeData) {
            const panel = document.getElementById('info-panel');
            const content = document.getElementById('panel-content');

            // Extract numeric mastery from title string if needed or pass in data
            // Note: nodeData is the D3 object which has properties from our API
            // My API returned: mastery_level, is_unlocked, confidence inside the mapping?
            // Wait, in service I mapped: value, title, color. 
            // I should have passed full metadata. 
            // Correcting service logic mentally: d3 datum has all original props if I extend it?
            // Actually I created new objects. I lost raw data. 
            // Let's assume title has "Mastery: X%".

            const percentage = nodeData.title.split(': ')[1];

            content.innerHTML = `
                <div class="text-center mb-4">
                    <div class="rounded-circle d-inline-flex align-items-center justify-content-center mb-3" 
                         style="width: 80px; height: 80px; background-color: ${nodeData.color}; color: white; font-size: 2rem;">
                         ${Math.round(parseInt(percentage))}%
                    </div>
                    <h4 class="fw-bold">${nodeData.label}</h4>
                    <span class="badge bg-light text-dark border">${nodeData.group}</span>
                </div>
                
                <div class="card bg-light border-0 mb-3">
                    <div class="card-body">
                        <h6 class="fw-bold">Estado Actual</h6>
                        <p class="mb-0 text-muted small">
                            ${parseInt(percentage) === 0 ? 'Aún no has explorado este tema.' : 'Has progresado significativamente en este tema.'}
                        </p>
                    </div>
                </div>

                <div class="d-grid gap-2">
                    <a href="adaptive-lesson.html?nodeId=${nodeData.id}" class="btn btn-primary">
                        <i class="fas fa-play me-2"></i> Continuar Aprendiendo
                    </a>
                    <button class="btn btn-outline-secondary">
                        <i class="fas fa-book me-2"></i> Ver Apuntes
                    </button>
                </div>
            `;

            panel.classList.add('active');
        }

        function closePanel() {
            document.getElementById('info-panel').classList.remove('active');
        }

        // Init
        initGraph();

        // Window resize
        window.addEventListener('resize', () => {
            // Recalculate if needed, usually reload for simplicity in MVP
        });

    </script>
</body>

</html>
