<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" id="page-description" content="Plataforma de calificaciones del Bachillerato General Estatal Héroes de la Patria - Consulta tus notas y seguimiento académico">
    <meta name="keywords" content="calificaciones, notas, académico, estudiantes, seguimiento, boletas, evaluación">
    <title id="page-title" data-base-title="Plataforma de Calificaciones | BGE Héroes de la Patria">Plataforma de Calificaciones | BGE Héroes de la Patria</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <script src="js/meta-updater.js" defer></script>
</head>
<body>
    <!-- Header y Footer se cargan dinámicamente -->
    <div id="header-container"></div>

    <main class="container mt-5 mb-5">
        <div class="row">
            <div class="col-lg-12">
                <h1 class="mb-4">
                    <i class="fas fa-graduation-cap me-2"></i>
                    Plataforma de Calificaciones
                </h1>

                <!-- Tabs de navegación -->
                <ul class="nav nav-tabs mb-4" id="gradesTab" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="current-tab" data-bs-toggle="tab" data-bs-target="#current" type="button" role="tab">
                            <i class="fas fa-book me-2"></i>Calificaciones Actuales
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="history-tab" data-bs-toggle="tab" data-bs-target="#history" type="button" role="tab">
                            <i class="fas fa-history me-2"></i>Historial
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="attendance-tab" data-bs-toggle="tab" data-bs-target="#attendance" type="button" role="tab">
                            <i class="fas fa-calendar-check me-2"></i>Asistencia
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="schedule-tab" data-bs-toggle="tab" data-bs-target="#schedule" type="button" role="tab">
                            <i class="fas fa-clock me-2"></i>Horario
                        </button>
                    </li>
                </ul>

                <!-- Contenido de los tabs -->
                <div class="tab-content" id="gradesTabContent">
                    <!-- Tab: Calificaciones Actuales -->
                    <div class="tab-pane fade show active" id="current" role="tabpanel">
                        <div class="alert alert-info">
                            <i class="fas fa-info-circle me-2"></i>
                            Selecciona una materia para ver más detalles
                        </div>

                        <div class="row" id="subjectsContainer">
                            <div class="col-md-6 col-lg-4 mb-3">
                                <div class="card">
                                    <div class="card-body">
                                        <h5 class="card-title">Matemáticas</h5>
                                        <p class="card-text">
                                            <span class="badge bg-success">92/100</span>
                                        </p>
                                        <button class="btn btn-sm btn-primary" onclick="showSubjectDetail('Matemáticas')">
                                            Ver Detalle
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-6 col-lg-4 mb-3">
                                <div class="card">
                                    <div class="card-body">
                                        <h5 class="card-title">Español</h5>
                                        <p class="card-text">
                                            <span class="badge bg-success">88/100</span>
                                        </p>
                                        <button class="btn btn-sm btn-primary" onclick="showSubjectDetail('Español')">
                                            Ver Detalle
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-6 col-lg-4 mb-3">
                                <div class="card">
                                    <div class="card-body">
                                        <h5 class="card-title">Química</h5>
                                        <p class="card-text">
                                            <span class="badge bg-warning">75/100</span>
                                        </p>
                                        <button class="btn btn-sm btn-primary" onclick="showSubjectDetail('Química')">
                                            Ver Detalle
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Tab: Historial -->
                    <div class="tab-pane fade" id="history" role="tabpanel">
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead class="table-dark">
                                    <tr>
                                        <th>Período</th>
                                        <th>Materia</th>
                                        <th>Calificación</th>
                                        <th>Estado</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td>2025-1</td>
                                        <td>Matemáticas</td>
                                        <td>85</td>
                                        <td><span class="badge bg-success">Aprobado</span></td>
                                    </tr>
                                    <tr>
                                        <td>2024-2</td>
                                        <td>Español</td>
                                        <td>90</td>
                                        <td><span class="badge bg-success">Aprobado</span></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Tab: Asistencia -->
                    <div class="tab-pane fade" id="attendance" role="tabpanel">
                        <button class="btn btn-warning mb-3" onclick="showAttendanceModal()">
                            <i class="fas fa-calendar-check me-2"></i>
                            Ver Registro de Asistencia
                        </button>
                    </div>

                    <!-- Tab: Horario -->
                    <div class="tab-pane fade" id="schedule" role="tabpanel">
                        <button class="btn btn-info mb-3" onclick="showScheduleModal()">
                            <i class="fas fa-clock me-2"></i>
                            Ver Horario de Clases
                        </button>
                    </div>
                </div>

                <!-- Botones de acción -->
                <div class="mt-4">
                    <button class="btn btn-success me-2" data-bs-toggle="modal" data-bs-target="#reportModal">
                        <i class="fas fa-file-pdf me-2"></i>
                        Generar Boleta
                    </button>
                    <button class="btn btn-danger" onclick="logoutGradeSystem()">
                        <i class="fas fa-sign-out-alt me-2"></i>
                        Cerrar Sesión
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal para generar boleta -->
    <div class="modal fade" id="reportModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title">
                        <i class="fas fa-file-pdf me-2"></i>
                        Generar Boleta
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">ID Estudiante:</label>
                        <input type="text" class="form-control" id="reportStudentId" placeholder="Ej: EST001">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Período:</label>
                        <select class="form-select" id="reportPeriod">
                            <option value="">Selecciona un período</option>
                            <option value="2025-1">2025-1</option>
                            <option value="2024-2">2024-2</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tipo de Reporte:</label>
                        <select class="form-select" id="reportType">
                            <option value="">Selecciona un tipo</option>
                            <option value="Boleta">Boleta</option>
                            <option value="Certificado">Certificado</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-success" onclick="generateReport()">Generar</button>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Main.js para cargar header y footer -->
    <script src="js/main.js"></script>

    <!-- Scripts específicos de calificaciones -->
    <script>
        // Función auxiliar para mostrar alertas
        function showAlert(message, type = 'info') {
            const alertHtml = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
            const alertContainer = document.createElement('div');
            alertContainer.className = 'container mt-3';
            alertContainer.innerHTML = alertHtml;
            document.body.insertBefore(alertContainer, document.body.firstChild);

            setTimeout(() => {
                alertContainer.remove();
            }, 5000);
        }

        // Función para generar boleta en PDF
        function generatePDF() {
            const printContent = `
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Boleta - BGE Héroes de la Patria</title>
                    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
                    <style>
                        @media print {
                            .no-print { display: none; }
                        }
                    </style>
                </head>
                <body>
                    <div class="container mt-4">
                        <h2 class="text-center">Boleta de Calificaciones</h2>
                        <h4 class="text-center">BGE Héroes de la Patria</h4>
                        <hr>
                        <p><strong>Periodo:</strong> 2025-1</p>
                        <p><strong>Estudiante:</strong> [Datos del estudiante]</p>
                        <table class="table table-bordered">
                            <thead class="table-dark">
                                <tr>
                                    <th>Materia</th>
                                    <th>Calificación</th>
                                    <th>Estado</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Matemáticas</td>
                                    <td>92</td>
                                    <td>Aprobado</td>
                                </tr>
                                <tr>
                                    <td>Español</td>
                                    <td>88</td>
                                    <td>Aprobado</td>
                                </tr>
                                <tr>
                                    <td>Química</td>
                                    <td>75</td>
                                    <td>Aprobado</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </body>
                </html>
            `;
            const printWindow = window.open('', '_blank');
            printWindow.document.write(printContent);
            printWindow.document.close();

            // Cerrar modal después de generar
            setTimeout(() => {
                bootstrap.Modal.getInstance(document.getElementById('reportModal')).hide();
                showAlert('¡Boleta generada exitosamente! Utiliza Ctrl+S en la ventana de impresión para guardar como PDF.', 'success');
            }, 1000);
        }

        // Mostrar detalle de materia
        function showSubjectDetail(materia) {
            showAlert(`Detalle de ${materia}: Funcionalidad en desarrollo. Aquí se mostrará información detallada de la materia.`, 'info');
        }

        // Función de reporte con validación
        function generateReport() {
            const studentId = document.getElementById('reportStudentId').value;
            const period = document.getElementById('reportPeriod').value;
            const type = document.getElementById('reportType').value;

            if (!studentId || !period || !type) {
                showAlert('Por favor completa todos los campos del reporte.', 'warning');
                return;
            }

            showAlert(`Generando ${type} para el ${period}... Esta funcionalidad estará disponible próximamente.`, 'info');
            bootstrap.Modal.getInstance(document.getElementById('reportModal')).hide();
        }

        function scrollToSection(sectionId) {
            const element = document.getElementById(sectionId);
            if (element) {
                element.scrollIntoView({
                    behavior: 'smooth',
                    block: 'start'
                });
            }
        }

        // Función para logout del sistema de calificaciones
        function logoutGradeSystem() {
            if (confirm('¿Estás seguro de que deseas cerrar sesión?')) {
                showAlert('Cerrando sesión...', 'info');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            }
        }

        // Función para mostrar modal de asistencia
        function showAttendanceModal() {
            const modalHtml = `
                <div class="modal fade" id="attendanceModal" tabindex="-1">
                    <div class="modal-dialog modal-lg">
                        <div class="modal-content">
                            <div class="modal-header bg-warning text-white">
                                <h5 class="modal-title"><i class="fas fa-calendar-check me-2"></i>Registro de Asistencia</h5>
                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <div class="card text-center border-success">
                                            <div class="card-body">
                                                <h3 class="text-success">92%</h3>
                                                <p class="mb-0">Asistencias</p>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="card text-center border-warning">
                                            <div class="card-body">
                                                <h3 class="text-warning">8%</h3>
                                                <p class="mb-0">Faltas</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <h6>Resumen por Materia:</h6>
                                <div class="table-responsive">
                                    <table class="table table-sm">
                                        <thead>
                                            <tr>
                                                <th>Materia</th>
                                                <th>Asistencias</th>
                                                <th>Faltas</th>
                                                <th>%</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr>
                                                <td>Matemáticas</td>
                                                <td class="text-success">35</td>
                                                <td class="text-danger">3</td>
                                                <td>92%</td>
                                            </tr>
                                            <tr>
                                                <td>Español</td>
                                                <td class="text-success">37</td>
                                                <td class="text-danger">1</td>
                                                <td>97%</td>
                                            </tr>
                                            <tr>
                                                <td>Química</td>
                                                <td class="text-success">33</td>
                                                <td class="text-danger">5</td>
                                                <td>87%</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                                <button type="button" class="btn btn-warning" onclick="generateAttendanceReport()">Descargar Reporte</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // Remover modal existente si existe
            const existingModal = document.getElementById('attendanceModal');
            if (existingModal) {
                existingModal.remove();
            }

            // Agregar modal al DOM
            document.body.insertAdjacentHTML('beforeend', modalHtml);

            // Mostrar modal
            const modal = new bootstrap.Modal(document.getElementById('attendanceModal'));
            modal.show();
        }

        // Función para mostrar modal de horarios
        function showScheduleModal() {
            const modalHtml = `
                <div class="modal fade" id="scheduleModal" tabindex="-1">
                    <div class="modal-dialog modal-lg">
                        <div class="modal-content">
                            <div class="modal-header bg-info text-white">
                                <h5 class="modal-title"><i class="fas fa-clock me-2"></i>Horario de Clases</h5>
                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <div class="table-responsive">
                                    <table class="table table-bordered">
                                        <thead class="table-dark">
                                            <tr>
                                                <th>Hora</th>
                                                <th>Lunes</th>
                                                <th>Martes</th>
                                                <th>Miércoles</th>
                                                <th>Jueves</th>
                                                <th>Viernes</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr>
                                                <td class="fw-bold">7:00-8:00</td>
                                                <td class="table-primary">Matemáticas</td>
                                                <td class="table-success">Español</td>
                                                <td class="table-primary">Matemáticas</td>
                                                <td class="table-warning">Química</td>
                                                <td class="table-info">Inglés</td>
                                            </tr>
                                            <tr>
                                                <td class="fw-bold">8:00-9:00</td>
                                                <td class="table-warning">Química</td>
                                                <td class="table-primary">Matemáticas</td>
                                                <td class="table-success">Español</td>
                                                <td class="table-success">Español</td>
                                                <td class="table-primary">Matemáticas</td>
                                            </tr>
                                            <tr>
                                                <td class="fw-bold">9:00-9:30</td>
                                                <td colspan="5" class="text-center table-light">RECESO</td>
                                            </tr>
                                            <tr>
                                                <td class="fw-bold">9:30-10:30</td>
                                                <td class="table-info">Inglés</td>
                                                <td class="table-warning">Química</td>
                                                <td class="table-info">Inglés</td>
                                                <td class="table-info">Inglés</td>
                                                <td class="table-warning">Química</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                                <button type="button" class="btn btn-info" onclick="printSchedule()">Imprimir Horario</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // Remover modal existente si existe
            const existingModal = document.getElementById('scheduleModal');
            if (existingModal) {
                existingModal.remove();
            }

            // Agregar modal al DOM
            document.body.insertAdjacentHTML('beforeend', modalHtml);

            // Mostrar modal
            const modal = new bootstrap.Modal(document.getElementById('scheduleModal'));
            modal.show();
        }

        // Función para generar reporte de asistencia
        function generateAttendanceReport() {
            showAlert('Generando reporte de asistencia... Se descargará en breve.', 'success');
            // Simular descarga
            setTimeout(() => {
                const modal = bootstrap.Modal.getInstance(document.getElementById('attendanceModal'));
                modal.hide();
            }, 1500);
        }

        // Función para imprimir horario
        function printSchedule() {
            const printContent = document.querySelector('#scheduleModal .modal-body').innerHTML;
            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title id="page-title" data-base-title="Plataforma de Calificaciones | BGE Héroes de la Patria">Plataforma de Calificaciones | BGE Héroes de la Patria</title>
                    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
                    <style>
                        @media print {
                            .no-print { display: none; }
                        }
                    </style>
                </head>
                <body>
                    <div class="container mt-4">
                        <h2 class="text-center mb-4">Horario de Clases - BGE Héroes de la Patria</h2>
                        ${printContent}
                    </div>
                </body>
                </html>
            `);
            printWindow.document.close();
            printWindow.print();
        }
    </script>
    <script src="js/tenant-config-loader.js" defer></script>

</body>
</html>
