<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente de Voz | BGE Héroes de la Patria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background: #1f2937;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .voice-orb {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle, #3b82f6, #1d4ed8);
            box-shadow: 0 0 20px #3b82f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .voice-orb:active {
            transform: scale(0.95);
        }

        .voice-orb.listening {
            animation: pulse 1.5s infinite;
            background: radial-gradient(circle, #ef4444, #b91c1c);
            box-shadow: 0 0 20px #ef4444;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }

        .transcript-box {
            margin-top: 20px;
            padding: 15px;
            background: #374151;
            border-radius: 10px;
            min-width: 300px;
            text-align: center;
        }
    </style>
    <!-- Global Header/Footer Styles -->
    <link rel="stylesheet" href="css/global-layout.css">
    <link rel="stylesheet" href="css/header-styles.css?v=2025111802">
    <link rel="stylesheet" href="css/footer-styles.css?v=2025111802">
    <script src="js/main.js" defer></script>
</head>

<body>
    <!-- Main Universal Header -->
    <header id="main-header"></header>

    <div class="text-center">
        <div class="voice-orb" id="mic-btn">
            <i class="fas fa-microphone"></i>
        </div>
        <h2 class="mt-4">Asistente de Aprendizaje</h2>
        <p class="text-gray-400">Presiona y di un comando: "Abrir matemáticas", "Repasar historia"</p>

        <div class="transcript-box" id="transcript">
            ...
        </div>
    </div>

    <script src="js/inline/voice-assistant-inline-1.js"></script>
    <script src="js/tenant-config-loader.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
