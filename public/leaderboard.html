<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking de Estudiantes | <span data-tenant-field="school_short_name">nuestro plantel</span></title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/leaderboard.css">
    <link rel="apple-touch-icon" href="/images/logo/logo-general-bge.webp">
    <meta name="theme-color" content="#1a1a2e">
    <!-- Global Header/Footer Styles -->
    <link rel="stylesheet" href="css/global-layout.css">
    <link rel="stylesheet" href="css/header-styles.css?v=2025111802">
    <link rel="stylesheet" href="css/footer-styles.css?v=2025111802">
    <script src="js/main.js" defer></script>
</head>

<body>
    <!-- Main Universal Header -->
    <header id="main-header"></header>

    

    <header class="leaderboard-hero">
        <h1 class="leaderboard-title"><i class="fas fa-trophy text-warning"></i> Salón de la Fama</h1>
        <p class="leaderboard-subtitle">Los estudiantes más destacados por su desempeño académico y participación.</p>
    </header>

    <main class="leaderboard-container">
        <div class="leaderboard-card">

            <div class="lb-tabs" role="tablist">
                <button class="lb-tab active" role="tab" aria-selected="true" data-type="global"
                    title="Ranking Global">Global (XP)</button>
                <button class="lb-tab" role="tab" aria-selected="false" data-type="streak"
                    title="Ranking de Rachas">Rachas</button>
                <button class="lb-tab" role="tab" aria-selected="false" data-type="weekly" title="Ranking Semanal"
                    onclick="alert('Próximamente: Torneos Semanales')">Semanal</button>
            </div>

            <ul class="lb-list" id="leaderboard-list">
                <!-- Loaded via JS -->
                <li class="list-unstyled text-center py-5">
                    <div class="spinner-border text-primary" role="status" title="Cargando ranking">
                        <span class="visually-hidden">Cargando...</span>
                    </div>
                </li>
            </ul>

        </div>
    </main>

    <!-- Template -->
    <template id="lb-item-template">
        <li class="lb-item">
            <div class="lb-rank">1</div>

            <div class="lb-user-info">
                <div class="lb-avatar">
                    <div class="tiny-avatar-layer lb-bg"></div>
                    <div class="tiny-avatar-layer lb-base"></div>
                    <div class="tiny-avatar-layer lb-frame"></div>
                </div>
                <div class="lb-details">
                    <span class="lb-username">Username</span>
                    <span class="lb-meta">Nivel 1 • Novato</span>
                </div>
            </div>

            <div class="lb-score">
                <span class="lb-score-value">1250</span>
                <span class="lb-score-label">XP</span>
            </div>
        </li>
    </template>

    <script src="js/leaderboard-viewer.js"></script>
    <script src="js/tenant-config-loader.js"></script>
    <script src="js/tenant-content-binder.js"></script>
        <footer id="main-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
