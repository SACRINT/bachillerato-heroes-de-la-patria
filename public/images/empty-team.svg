<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="gradAvatar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="gradSecondary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="200" cy="150" r="110" fill="url(#gradBg)" />

  <!-- Central Character -->
  <circle cx="200" cy="115" r="28" fill="url(#gradAvatar)" />
  <path d="M155 190 C155 155, 245 155, 245 190 Z" fill="url(#gradAvatar)" />

  <!-- Left Team Member (Silhouette) -->
  <circle cx="140" cy="130" r="20" fill="url(#gradSecondary)" opacity="0.8" />
  <path d="M105 190 C105 162, 175 162, 175 190 Z" fill="url(#gradSecondary)" opacity="0.8" />

  <!-- Right Team Member (Silhouette) -->
  <circle cx="260" cy="130" r="20" fill="url(#gradSecondary)" opacity="0.8" />
  <path d="M225 190 C225 162, 295 162, 295 190 Z" fill="url(#gradSecondary)" opacity="0.8" />

  <!-- Plus / Add Badge -->
  <circle cx="200" cy="215" r="16" fill="#10b981" />
  <path d="M200 207 L200 223 M192 215 L208 215" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

  <!-- Subtle Sparkles / Floating Elements -->
  <circle cx="110" cy="90" r="4" fill="#fbbf24" opacity="0.8" />
  <polygon points="290,85 293,92 300,95 293,98 290,105 287,98 280,95 287,92" fill="#fbbf24" opacity="0.9" />
  <circle cx="285" cy="170" r="3" fill="#60a5fa" opacity="0.7" />
  <circle cx="115" cy="165" r="3" fill="#34d399" opacity="0.7" />
</svg>
