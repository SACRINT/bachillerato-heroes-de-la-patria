<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Compra Exitosa! - IACoins</title>
    <style>
        :root {
            --success: #10b981;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --gradient: linear-gradient(135deg, #10b981 0%, #14b8a6 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .success-container {
            text-align: center;
            max-width: 500px;
            padding: 3rem;
            background: var(--bg-card);
            border-radius: 24px;
            margin: 1rem;
        }

        .success-icon {
            width: 100px;
            height: 100px;
            background: var(--gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            font-size: 3rem;
            animation: bounce 0.6s ease;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .coins-received {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f59e0b 0%, #f97316 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 1rem 0;
        }

        p {
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-block;
            padding: 1rem 2rem;
            background: var(--gradient);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .loading {
            display: none;
        }

        .loading.active {
            display: block;
        }

        .hidden {
            display: none;
        }

        .visible {
            display: block;
        }

        .error-icon {
            background: linear-gradient(135deg, #ef4444, #f97316);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--bg-card);
            border-top-color: var(--success);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
    <!-- Global Header/Footer Styles -->
    <link rel="stylesheet" href="css/global-layout.css">
    <link rel="stylesheet" href="css/header-styles.css?v=2025111802">
    <link rel="stylesheet" href="css/footer-styles.css?v=2025111802">
    <script src="js/main.js" defer></script>
</head>

<body>
    <!-- Main Universal Header -->
    <header id="main-header"></header>
    <div class="success-container">
        <div id="loading" class="loading active">
            <div class="spinner"></div>
            <p>Procesando tu compra...</p>
        </div>
        <div id="success" class="hidden">
            <div class="success-icon">✓</div>
            <h1>¡Compra Exitosa!</h1>
            <div class="coins-received" id="coins-amount">--- IACoins</div>
            <p>Tus IACoins han sido acreditados a tu cuenta.</p>
            <a href="/iacoins-store.html" class="btn">Volver a la Tienda</a>
        </div>
        <div id="error" class="hidden">
            <div class="success-icon error-icon">✗</div>
            <h1>Error en el Pago</h1>
            <p id="error-msg">Hubo un problema procesando tu pago.</p>
            <a href="/iacoins-store.html" class="btn">Intentar de Nuevo</a>
        </div>
    </div>
    <script src="js/inline/iacoins-success-inline-1.js"></script>
    <script src="js/tenant-config-loader.js"></script>
    <script src="js/tenant-content-binder.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
