<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de Documentos | BGE Héroes de la Patria</title>

    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .pdf-header {
            background: #374151;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pdf-container {
            height: calc(100vh - 60px);
            background: #525659;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .progress-bar-custom {
            height: 4px;
            background: #3b82f6;
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>

<body>

    <header class="pdf-header">
        <div class="d-flex align-items-center gap-3">
            <a href="estudiantes.html" class="text-white" title="Volver al Portal Estudiantil" aria-label="Volver al Portal Estudiantil"><i
                    class="fas fa-arrow-left"></i></a>
            <h1 class="h6 m-0" id="doc-title">Cargando Documento...</h1>
        </div>
        <div>
            <span class="badge bg-primary" id="page-indicator">Página 1 / --</span>
            <button class="btn btn-sm btn-outline-light ms-2" onclick="toggleFullscreen()" title="Pantalla Completa"
                aria-label="Pantalla Completa">
                <i class="fas fa-expand"></i>
            </button>
        </div>
    </header>

    <div class="progress-bar-custom" id="read-progress"></div>

    <main class="pdf-container">
        <!-- Native PDF Viewer or Simulated for Prototype -->
        <iframe id="pdf-frame" src="" title="PDF Viewer"></iframe>
    </main>

    <!-- JS -->
    <script>
        // Prototype logic
        document.addEventListener('DOMContentLoaded', () => {
            // Mock load
            const docUrl = '/assets/docs/demo.pdf'; // Placeholder
            document.getElementById('pdf-frame').src = docUrl;
            document.getElementById('doc-title').textContent = "Guía de Estudio: Revolución Mexicana";

            // Simulator for progress (In real app, PDF.js provides events)
            let progress = 0;
            setInterval(() => {
                if (progress < 100) {
                    progress += 1; // Simulate reading
                    document.getElementById('read-progress').style.width = progress + '%';

                    // API Call on 100%
                    if (progress === 100) {
                        console.log('Document completed, syncing...');
                    }
                }
            }, 500);
        });

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>
</body>

</html>
