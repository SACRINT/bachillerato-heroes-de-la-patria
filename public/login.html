<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - BGE <span data-tenant-field="school_short_name">nuestro plantel</span></title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            max-width: 450px;
            width: 100%;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-container img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #667eea;
            padding: 10px;
            background: white;
        }

        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }

        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #ddd;
        }

        .divider span {
            background: white;
            padding: 0 10px;
            position: relative;
            color: #666;
            font-size: 14px;
        }
    </style>
    <!-- Global Header/Footer Styles -->
    <link rel="stylesheet" href="css/global-layout.css">
    <link rel="stylesheet" href="css/header-styles.css?v=2025111802">
    <link rel="stylesheet" href="css/footer-styles.css?v=2025111802">
    <script src="js/main.js" defer></script>
</head>

<body>
    <!-- Main Universal Header -->
    <header id="main-header"></header>
    <div class="login-container">
        <div class="login-card">
            <!-- Logo -->
            <div class="logo-container">
                <img data-tenant-src="logo_url" data-tenant-src="logo_url" src="/images/logo-bachillerato-HDLP.webp" alt="Logo del Bachillerato">
                <h4 class="mt-3 mb-1">Bienvenido de vuelta</h4>
                <p class="text-muted">Inicia sesión para continuar</p>
            </div>

            <!-- Alert para mensajes -->
            <div id="alert-container"></div>

            <!-- Login Form -->
            <form id="login-form">
                <div class="mb-3">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" placeholder="tu@email.com"
                            required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="••••••••"
                            required>
                        <button class="btn btn-outline-secondary" type="button" id="toggle-password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="remember-me">
                    <label class="form-check-label" for="remember-me">Recordarme</label>
                </div>

                <button type="submit" class="btn btn-primary btn-login w-100" id="submit-btn">
                    <i class="fas fa-sign-in-alt me-2"></i>Iniciar Sesión
                </button>
            </form>

            <!-- Forgot Password -->
            <div class="text-center mt-3">
                <a href="#" class="text-muted small">¿Olvidaste tu contraseña?</a>
            </div>

            <!-- Divider -->
            <div class="divider">
                <span>o</span>
            </div>

            <!-- OAuth buttons (placeholder) -->
            <button class="btn btn-outline-secondary w-100 mb-2" disabled>
                <i class="fab fa-google me-2"></i>Continuar con Google
            </button>

            <!-- Register Link -->
            <div class="text-center mt-4">
                <p class="text-muted">¿No tienes cuenta?
                    <a href="register.html" class="fw-bold">Regístrate aquí</a>
                </p>
            </div>

            <!-- Back to home -->
            <div class="text-center mt-3">
                <a href="index.html" class="text-muted small">
                    <i class="fas fa-arrow-left me-1"></i>Volver al inicio
                </a>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Simple Auth -->
    <script src="js/simple-auth.js"></script>

    <!-- Login Logic -->
    <script src="js/login-page.js"></script>
    <script src="js/tenant-config-loader.js"></script>
    <script src="js/tenant-content-binder.js"></script>
</body>

</html>
