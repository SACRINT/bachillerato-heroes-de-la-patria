<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - BGE Héroes de la Patria</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
        }

        .register-container {
            max-width: 600px;
            width: 100%;
            padding: 20px;
        }

        .register-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-container img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #667eea;
            padding: 10px;
            background: white;
        }

        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }

        .btn-register {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .password-strength {
            height: 5px;
            background: #e9ecef;
            border-radius: 3px;
            margin-top: 5px;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            transition: all 0.3s;
        }
    </style>
    <!-- Global Header/Footer Styles -->
    <link rel="stylesheet" href="css/global-layout.css">
    <link rel="stylesheet" href="css/header-styles.css?v=2025111802">
    <link rel="stylesheet" href="css/footer-styles.css?v=2025111802">
    <script src="js/main.js" defer></script>
</head>

<body>
    <!-- Main Universal Header -->
    <header id="main-header"></header>
    <div class="register-container">
        <div class="register-card">
            <!-- Logo -->
            <div class="logo-container">
                <img src="images/logo-bachillerato-HDLP.webp" alt="Logo BGE">
                <h4 class="mt-3 mb-1">Crear Cuenta</h4>
                <p class="text-muted">Únete a nuestra comunidad educativa</p>
            </div>

            <!-- Alert para mensajes -->
            <div id="alert-container"></div>

            <!-- Register Form -->
            <form id="register-form">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="nombre" class="form-label">Nombre(s) *</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="apellido" class="form-label">Apellido(s) *</label>
                        <input type="text" class="form-control" id="apellido" name="apellido" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Correo Electrónico *</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" placeholder="tu@email.com"
                            required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña *</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password"
                            placeholder="Mínimo 8 caracteres" required minlength="8">
                        <button class="btn btn-outline-secondary" type="button" id="toggle-password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="password-strength">
                        <div class="password-strength-bar" id="password-strength-bar"></div>
                    </div>
                    <small class="text-muted" id="password-strength-text"></small>
                </div>

                <div class="mb-3">
                    <label for="password-confirm" class="form-label">Confirmar Contraseña *</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control" id="password-confirm" name="password_confirm"
                            placeholder="Repite tu contraseña" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="role" class="form-label">Tipo de Usuario *</label>
                        <select class="form-select" id="role" name="role" required>
                            <option value="">Selecciona...</option>
                            <option value="student">Estudiante</option>
                            <option value="parent">Padre/Tutor</option>
                            <option value="teacher">Docente</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="phone" class="form-label">Teléfono</label>
                        <input type="tel" class="form-control" id="phone" name="phone" placeholder="(000) 000-0000">
                    </div>
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="terms" required>
                    <label class="form-check-label small" for="terms">
                        Acepto los <a href="terminos.html" target="_blank">Términos y Condiciones</a>
                        y la <a href="privacidad.html" target="_blank">Política de Privacidad</a>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-register w-100" id="submit-btn">
                    <i class="fas fa-user-plus me-2"></i>Crear Cuenta
                </button>
            </form>

            <!-- Login Link -->
            <div class="text-center mt-4">
                <p class="text-muted">¿Ya tienes cuenta?
                    <a href="login.html" class="fw-bold">Inicia sesión aquí</a>
                </p>
            </div>

            <!-- Back to home -->
            <div class="text-center mt-3">
                <a href="index.html" class="text-muted small">
                    <i class="fas fa-arrow-left me-1"></i>Volver al inicio
                </a>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Simple Auth -->
    <script src="js/simple-auth.js"></script>

    <!-- Register Logic -->
    <script>
        // Toggle password visibility
        document.getElementById('toggle-password').addEventListener('click', function () {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        // Password strength checker
        document.getElementById('password').addEventListener('input', function () {
            const password = this.value;
            const strengthBar = document.getElementById('password-strength-bar');
            const strengthText = document.getElementById('password-strength-text');

            let strength = 0;
            let text = '';
            let color = '';

            if (password.length >= 8) strength++;
            if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength++;
            if (password.match(/\d/)) strength++;
            if (password.match(/[^a-zA-Z\d]/)) strength++;

            switch (strength) {
                case 0:
                case 1:
                    text = 'Débil';
                    color = '#dc3545';
                    break;
                case 2:
                    text = 'Media';
                    color = '#ffc107';
                    break;
                case 3:
                    text = 'Fuerte';
                    color = '#28a745';
                    break;
                case 4:
                    text = 'Muy Fuerte';
                    color = '#20c997';
                    break;
            }

            strengthBar.style.width = (strength * 25) + '%';
            strengthBar.style.backgroundColor = color;
            strengthText.textContent = password.length > 0 ? `Fortaleza: ${text}` : '';
        });

        // Show alert function
        function showAlert(message, type = 'danger') {
            const alertContainer = document.getElementById('alert-container');
            alertContainer.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'} me-2"></i>
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;

            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Handle register form submission
        document.getElementById('register-form').addEventListener('submit', async function (e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submit-btn');
            const originalText = submitBtn.innerHTML;

            // Get form data
            const formData = new FormData(this);
            const userData = Object.fromEntries(formData);

            // Validate passwords match
            if (userData.password !== userData.password_confirm) {
                showAlert('Las contraseñas no coinciden', 'danger');
                return;
            }

            // Remove password confirm
            delete userData.password_confirm;

            try {
                // Show loading
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Creando cuenta...';

                // Call register
                const result = await SimpleAuth.register(userData);

                // Success!
                showAlert('¡Cuenta creada exitosamente! Redirigiendo...', 'success');

                // Redirect after 1.5 seconds
                setTimeout(() => {
                    window.location.href = '/estudiantes.html';
                }, 1500);

            } catch (error) {
                // Show error
                showAlert(error.message || 'Error al crear cuenta. Intenta nuevamente.', 'danger');

                // Reset button
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalText;
            }
        });

        // If already logged in, redirect
        if (SimpleAuth.isAuthenticated()) {
            window.location.href = '/estudiantes.html';
        }
    </script>
    <script src="js/tenant-config-loader.js" defer></script>
</body>

</html>
