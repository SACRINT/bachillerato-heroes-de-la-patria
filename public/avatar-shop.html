<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudio de Avatares | Bachillerato General <span data-tenant-field="school_short_name">nuestro plantel</span></title>
    <meta name="description" content="Personaliza tu avatar estudiantil con marcos, fondos y accesorios ganados con tus IACoins.">

    <!-- Fuentes y Estilos -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos Propios -->
    <link rel="stylesheet" href="css/avatar-shop.css">

    <!-- PWA y Metadatos -->
    <meta name="theme-color" content="#0d6efd">
    <link rel="apple-touch-icon" href="/images/logo-bachillerato-HDLP.webp">
    <!-- Global Header/Footer Styles -->
    <link rel="stylesheet" href="css/global-layout.css">
    <link rel="stylesheet" href="css/header-styles.css?v=2025111802">
    <link rel="stylesheet" href="css/footer-styles.css?v=2025111802">
    <script src="js/main.js" defer></script>
</head>

<body>
    <!-- Main Universal Header -->
    <header id="main-header"></header>

    <div class="avatar-shop-container">

        <!-- Columna Izquierda: Previsualización -->
        <aside class="avatar-preview-card">
            <h3 class="mb-4">Tu Identidad</h3>

            <div class="avatar-stage">
                <!-- Capas ordenadas por Z-Index -->
                <div class="avatar-layer z-bg"></div>
                <div class="avatar-layer z-base"></div>
                <div class="avatar-layer z-accessory"></div>
                <div class="avatar-layer z-frame"></div>
            </div>

            <div class="user-stats-mini mt-3">
                <div class="stat-item" title="Nivel de Estilo">
                    <i class="fas fa-star text-warning"></i> Nv. Estilo 4
                </div>
                <div class="stat-item" title="Rareza Total">
                    <i class="fas fa-gem text-info"></i> Élite
                </div>
            </div>

            <p class="text-muted small mt-3">
                Tu avatar será visible en los foros, leaderboards, torneos y perfil público.
            </p>
            <a href="gamification-center.html" class="btn btn-outline-light btn-sm w-100 mt-2">← Volver al Centro</a>
        </aside>

        <!-- Columna Derecha: Tienda -->
        <main class="shop-section">
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
                <h2 class="mb-0"><i class="fas fa-store me-2 text-warning"></i> Tienda de Personalización</h2>
                <div class="badge bg-warning text-dark fs-6 px-3 py-2 rounded-pill shadow-sm">
                    <i class="fas fa-coins me-1"></i> Saldo: <span id="user-balance" class="fw-bold">250</span> IACoins
                </div>
            </div>

            <div class="shop-tabs" role="tablist">
                <button class="shop-tab active" data-type="all" role="tab" aria-selected="true">Todo</button>
                <button class="shop-tab" data-type="bases" role="tab" aria-selected="false">Avatares</button>
                <button class="shop-tab" data-type="frames" role="tab" aria-selected="false">Marcos</button>
                <button class="shop-tab" data-type="bgs" role="tab" aria-selected="false">Fondos</button>
                <button class="shop-tab" data-type="accessories" role="tab" aria-selected="false">Accesorios</button>
            </div>

            <div id="items-grid" class="items-grid">
                <!-- Dynamic Items Here -->
                <div class="text-center w-100 py-5">
                    <div class="spinner-border text-primary" role="status" title="Cargando artículos">
                        <span class="visually-hidden">Cargando...</span>
                    </div>
                </div>
            </div>
        </main>

    </div>

    <!-- Scripts -->
    <script src="js/avatar-shop.js"></script>
    <script src="js/tenant-config-loader.js"></script>
    <script src="js/tenant-content-binder.js"></script>
        <footer id="main-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
