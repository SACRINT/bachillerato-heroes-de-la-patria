<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudio de Avatares | Bachillerato General Héroes de la Patria</title>

    <!-- Fuentes y Estilos -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos Propios -->
    <link rel="stylesheet" href="css/avatar-shop.css">
</head>

<body>

    <!-- Navbar simple de retorno -->
    <nav class="navbar navbar-dark bg-transparent px-4">
        <a class="navbar-brand fw-bold" href="iacoins-dashboard.html">
            <i class="fas fa-arrow-left me-2"></i> Volver al Dashboard
        </a>
        <div class="user-balance-summary text-warning fw-bold">
            <i class="fas fa-coins"></i> <span id="user-balance">...</span>
        </div>
    </nav>

    <div class="avatar-shop-container">

        <!-- Columna Izquierda: Previsualización -->
        <aside class="avatar-preview-card">
            <h3 class="mb-4">Tu Identidad</h3>

            <div class="avatar-stage">
                <!-- Capas ordenadas por Z-Index -->
                <div class="avatar-layer z-bg"></div>
                <div class="avatar-layer z-base"></div>
                <div class="avatar-layer z-accessory"></div>
                <div class="avatar-layer z-frame"></div>
            </div>

            <div class="user-stats-mini">
                <div class="stat-item" title="Nivel de Estilo">
                    <i class="fas fa-star"></i> Nv. Estilo
                </div>
                <div class="stat-item" title="Rareza Total">
                    <i class="fas fa-gem"></i> Rareza
                </div>
            </div>

            <p class="text-muted small mt-3">
                Tu avatar será visible en los foros, leaderboards y perfil público.
            </p>
        </aside>

        <!-- Columna Derecha: Tienda -->
        <main class="shop-section">
            <h2 class="mb-4"><i class="fas fa-store me-2 text-warning"></i> Tienda de Personalización</h2>

            <div class="shop-tabs">
                <button class="shop-tab active" data-type="all">Todo</button>
                <button class="shop-tab" data-type="bases">Avatares</button>
                <button class="shop-tab" data-type="frames">Marcos</button>
                <button class="shop-tab" data-type="bgs">Fondos</button>
                <button class="shop-tab" data-type="accessories">Accesorios</button>
            </div>

            <div id="items-grid" class="items-grid">
                <!-- Dynamic Items Here -->
                <div class="text-center w-100 py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Cargando...</span>
                    </div>
                </div>
            </div>
        </main>

    </div>

    <!-- Scripts -->
    <script src="js/avatar-shop.js"></script>
</body>

</html>
